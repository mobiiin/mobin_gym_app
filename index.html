p{background:#000b}dialog h2{margin:0;font-size:23px}dialog .row{margin-bottom:12px}.close{background:none;border:0;color:#bbc3b3;font-size:25px}.formscroll{overflow:auto;max-height:72dvh}.note{color:#c7d79e;font-size:12px}.historydate{font-size:12px;color:var(--lime);margin:18px 0 7px;font-weight:700}@media(min-width:600px){main{padding-top:40px}.hero h1{font-size:50px}}

poolitem{font-size:13px}</style></head><body><main><header class="top"><div class="brand">FORGE<span>.</span></div><div class="badge">YOUR DAILY EDGE</div></header><div id="content"></div></main><nav class="nav" aria-label="Main navigation"><button data-page="home"><b>◉</b>Today</button><button data-page="food"><b>◒</b>Fuel</button><button data-page="training"><b>▥</b>Training</button><button data-page="settings"><b>⚙</b>Settings</button></nav><dialog id="modal"><div class="row"><h2 id="modalTitle"></h2><button class="close" id="close" aria-label="Close">×</button></div><div class="formscroll" id="modalBody"></div></dialog><script>
const key='forge-fitness-v1';const defaults={goals:{calories:2200,protein:150,carbs:250,fat:70},foods:[],sets:[]};let state;try{state=JSON.parse(localStorage.getItem(key))||structuredClone(defaults);if(!state.goals||!Array.isArray(state.foods)||!Array.isArray(state.sets))throw 0}catch{state=structuredClone(defaults)}let page='home';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(key,JSON.stringify(state));const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const num=v=>Number(v)||0;const sum=(items,k)=>items.reduce((a,x)=>a+num(x[k]),0);const datefmt=d=>{let [y,m,day]=d.split('-');return new Date(+y,+m-1,+day).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})};const foodlist=(items)=>items.length?items.map(x=>`<div class="entry row"><div><strong>${esc(x.name)}</strong><small>${esc(x.meal)} · ${num(x.calories)} kcal · ${num(x.protein)}g protein</small></div><button class="iconbtn" data-delete="food" data-id="${esc(x.id)}" aria-label="Delete ${esc(x.name)}">×</button></div>`).join(''):'<p class="empty">Nothing logged yet. Your next small step starts here.</p>';const setlist=(items)=>items.length?items.map(x=>`<div class="entry row"><div><strong>${esc(x.exercise)}</strong><small>${num(x.sets)} sets × ${num(x.reps)} reps · ${num(x.weight)} ${esc(x.unit)}</small></div><button class="iconbtn" data-delete="set" data-id="${esc(x.id)}" aria-label="Delete ${esc(x.exercise)}">×</button></div>`).join(''):'<p class="empty">No exercises logged yet. Time to put in work.</p>';const grouped=(items,renderer)=>{let dates=[...new Set(items.map(x=>x.date))].sort().reverse();return dates.length?dates.map(d=>`<div class="historydate">${datefmt(d)}</div><div class="card">${renderer(items.filter(x=>x.date===d).reverse())}</div>`).join(''):`<div class="card">${renderer([])}</div>`};
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let foods=state.foods.filter(x=>x.date===today()),sets=state.sets.filter(x=>x.date===today()),cal=sum(foods,'calories'),g=state.goals;let macro=(name,k)=>`<div><div class="label">${name}</div><div class="bar"><span style="width:${Math.min(100,num(g[k])?sum(foods,k)/num(g[k])*100:0)}%"></span></div><strong>${sum(foods,k)} <span class="label">/ ${num(g[k])}g</span></strong></div>`;if(page==='home')$('#content').innerHTML=`<section class="hero"><div class="eyebrow">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div><h1>SHOW UP.<br>LEVEL UP<span style="color:var(--lime)">.</span></h1><p>Build the body. Track the process.</p></section><div class="card"><div class="cardtop"><div><div class="label">TODAY'S FUEL</div><div class="big">${cal.toLocaleString()} <small>kcal</small></div><div class="label">${Math.max(0,num(g.calories)-cal).toLocaleString()} kcal remaining · Goal ${num(g.calories).toLocaleString()}</div></div><div class="ring" style="--progress:${Math.min(100,num(g.calories)?cal/num(g.calories)*100:0)}%" data-text="${Math.round(num(g.calories)?cal/num(g.calories)*100:0)}%"></div></div><div class="macrogrid">${macro('PROTEIN','protein')}${macro('CARBS','carbs')}${macro('FAT','fat')}</div></div><div class="sectionhead"><h2>Make it count</h2><small>QUICK ACTIONS</small></div><div class="quick"><button class="action" data-add="food"><span>＋</span>Log food</button><button class="action alt" data-add="set"><span>↗</span>Log exercise</button></div><div class="sectionhead"><h2>Today's training</h2><small>${sets.length} EXERCISES</small></div><div class="card">${setlist([...sets].reverse())}</div><div class="sectionhead"><h2>Today's fuel</h2><small>${foods.length} ENTRIES</small></div><div class="card">${foodlist([...foods].reverse())}</div>`;if(page==='food')$('#content').innerHTML=`<h2 class="page">Fuel your work<span style="color:var(--lime)">.</span></h2><p class="sub">Every meal is part of the plan.</p><button class="primary" data-add="food">＋ Log food</button><div class="sectionhead"><h2>Food history</h2><small>ALL ENTRIES</small></div>${grouped(state.foods,foodlist)}`;if(page==='training')$('#content').innerHTML=`<h2 class="page">Put in work<span style="color:var(--lime)">.</span></h2><p class="sub">Record the reps. See the progress.</p><button class="primary" data-add="set">＋ Log exercise</button><div class="sectionhead"><h2>Training history</h2><small>ALL ENTRIES</small></div>${grouped(state.sets,setlist)}`;if(page==='settings')$('#content').innerHTML=`<h2 class="page">Your setup<span style="color:var(--lime)">.</span></h2><p class="sub">Make the numbers work for you.</p><div class="card"><h3>Daily targets</h3><p class="help">Starting placeholders—set these to your own goals.</p><form id="goals">${['calories','protein','carbs','fat'].map(k=>`<label class="field">${k[0].toUpperCase()+k.slice(1)} ${k==='calories'?'(kcal)':'(g)'}<input required type="number" min="0" step="1" name="${k}" value="${num(g[k])}"></label>`).join('')}<button class="primary">Save targets</button></form></div><div class="card"><h3>Your data</h3><p class="help">Entries are stored on this device. Export a backup regularly; clearing browser or web app data can erase them. Import replaces current entries.</p><button class="secondary" id="export">Export backup</button><label class="secondary" style="display:block;text-align:center;cursor:pointer">Import backup<input id="import" type="file" accept="application/json" hidden></label></div>`}
function openModal(type){$('#modalTitle').textContent=type==='food'?'Log food':'Log exercise';let date=`<label class="field">Date<input type="date" name="date" required value="${today()}"></label>`;let food=`<label class="field">Food or meal<input name="name" required maxlength="100" placeholder="e.g. Chicken and rice"></label><label class="field">Meal<select name="meal"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option></select></label><div class="grid">${[['calories','Calories (kcal)'],['protein','Protein (g)'],['carbs','Carbs (g)'],['fat','Fat (g)']].map(([k,l])=>`<label class="field">${l}<input type="number" min="0" step="any" name="${k}" value="0" required></label>`).join('')}</div>`;let exercise=`<label class="field">Exercise<input name="exercise" required maxlength="100" placeholder="e.g. Bench press"></label><div class="grid"><label class="field">Sets<input type="number" min="1" step="1" name="sets" value="3" required></label><label class="field">Reps per set<input type="number" min="1" step="1" name="reps" value="10" required></label><label class="field">Weight<input type="number" min="0" step="any" name="weight" value="0" required></label><label class="field">Unit<select name="unit"><option>lb</option><option>kg</option></select></label></div><p class="help">For sets with different weights or reps, log a separate entry for each.</p>`;$('#modalBody').innerHTML=`<form id="entryform">${date}${type==='food'?food:exercise}<button class="primary">Save ${type==='food'?'food':'exercise'}</button></form>`;$('#entryform').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));data.id=crypto.randomUUID();(type==='food'?state.foods:state.sets).push(data);save();$('#modal').close();render()};$('#modal').showModal()}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-page]'),add=e.target.closest('[data-add]'),del=e.target.closest('[data-delete]');if(nav){page=nav.dataset.page;render();window.scrollTo(0,0)}if(add)openModal(add.dataset.add);if(del&&confirm('Delete this entry?')){let arr=del.dataset.delete==='food'?'foods':'sets';state[arr]=state[arr].filter(x=>x.id!==del.dataset.id);save();render()}if(e.target.id==='close')$('#modal').close();if(e.target.id==='export'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download=`forge-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}});document.addEventListener('submit',e=>{if(e.target.id==='goals'){e.preventDefault();let f=new FormData(e.target);for(let k of ['calories','protein','carbs','fat'])state.goals[k]=num(f.get(k));save();alert('Targets saved.');render()}});document.addEventListener('change',async e=>{if(e.target.id==='import'&&e.target.files[0]){try{let data=JSON.parse(await e.target.files[0].text());if(!data.goals||!Array.isArray(data.foods)||!Array.isArray(data.sets))throw Error();if(confirm('Replace your current entries and targets with this backup?')){state=data;save();render()}}catch{alert('Could not read that backup.')}}});

const DEFAULT_DAYS=[{"name":"Day 1 — Back + Biceps + Traps","priority":["Wide-Grip Lat Pulldown","Chest-Supported Row","Kelso Shrug","Standing Dumbbell Curl","Hammer Curl","Barbell Shrug"],"optional":["Meadows Row","Farmer’s Walk","Flat Bench / Machine Press","Pec Deck / Cable Fly"]},{"name":"Day 2 — Shoulders + Arms + Forearms","priority":["Dumbbell Overhead Press","Cable Lateral Raise","Face-Away Bayesian Curl","Overhead Cable Triceps Extension","Reverse Curl","Reverse Pec Deck"],"optional":["EZ-Bar Curl","Triceps Pressdown","Wrist Curl","Farmer’s Walk","Neck Curl"]},{"name":"Day 3 — Quads + Calves + Legs","priority":["Hack Squat / Squat","Leg Press","Leg Extension","Calf Raise","Romanian Deadlift","Leg Curl"],"optional":["Hip Thrust","Cable Crunch","Hanging Leg Raise","Ab Wheel / Pallof Press"]},{"name":"Day 4 — Upper Back + Shoulders + Arms","priority":["Neutral-Grip Pull-Up","Cable Row","Kelso Shrug","Cable Lateral Raise","Preacher Curl only if pain-free; otherwise Standing Cable Curl","Triceps Pressdown","Reverse Curl"],"optional":["Machine Shoulder Press","Barbell Shrug","Farmer’s Walk","Machine/DB Chest Press","Rope Face Pull","Cable Crunch","Neck Extension"]},{"name":"Day 5 — Back + Arms + Delts","priority":["Neutral-Grip Lat Pulldown","One-Arm Dumbbell Row","Incline Dumbbell Curl","Overhead Cable Triceps Extension","Hammer Curl","Cable Lateral Raise","Dumbbell Shrug"],"optional":["Cable Lat Prayer","Triceps Pressdown","Inverse Zottman Curl","Farmer’s Walk or Dead Hang","Flat Bench / Machine Press","Cable Crossover","Hanging Leg Raise"]}];
const DEFAULT_POOL=["Face-Away Bayesian Curl","Machine Preacher Curl (only if comfortable)","Preacher Hammer Curl (only if comfortable)","EZ-Bar Curl","Standing Dumbbell Curl","Incline Dumbbell Curl","Lying Dumbbell Curl","Modified 21s","Standing Cable Curl","Bayesian Cable Curl Variation","Cheat Curl","Strict Curl","Hammer Curl","Inverse Zottman Curl"];
let selectedExercise=''; let restEnd=0; let restHandle=null;
function ensureExtraState(){if(!state.plans||typeof state.plans!=='object')state.plans={Push:'',Pull:'',Legs:''};if(!Array.isArray(state.body))state.body=[];if(!Array.isArray(state.dayPlans))state.dayPlans=structuredClone(DEFAULT_DAYS);if(!Array.isArray(state.exercisePool))state.exercisePool=[...DEFAULT_POOL]}
function bodyMarkup(){ensureExtraState();let entries=[...state.body].sort((a,b)=>b.date.localeCompare(a.date));return entries.length?entries.slice(0,5).map(x=>`<div class="entry row"><div><strong>${num(x.weight)} ${esc(x.unit)}</strong><small>${datefmt(x.date)}</small></div><button class="iconbtn" data-body-delete="${esc(x.id)}" aria-label="Delete body weight">×</button></div>`).join(''):'<p class="empty">No weigh-ins yet. Add one to see your history.</p>'}
function plansMarkup(){ensureExtraState();const exerciseList=(list,start=1)=>list.length?`<ol class="planlist" start="${start}">${list.map(name=>`<li><button class="planexercise" data-plan-log="${esc(name)}">${esc(name)} <span>＋ log</span></button></li>`).join('')}</ol>`:'<p class="help">No exercises added.</p>';return state.dayPlans.map((d,i)=>`<details class="plan-day"><summary><span>${esc(d.name)}</span><span class="muted">${d.priority.length+d.optional.length} exercises</span></summary><p class="eyebrow">PRIORITY WORK</p>${exerciseList(d.priority)}<p class="eyebrow">IF YOU HAVE MORE TIME</p>${exerciseList(d.optional,d.priority.length+1)}<div class="plan-actions"><button class="smallbtn" data-plan-edit="${i}">Edit day</button><button class="smallbtn" data-plan-move="${i}" data-dir="-1" ${i===0?'disabled':''}>↑</button><button class="smallbtn" data-plan-move="${i}" data-dir="1" ${i===state.dayPlans.length-1?'disabled':''}>↓</button><button class="smallbtn" data-plan-delete="${i}">Remove day</button></div></details>`).join('')||'<p class="empty">Add a training day to build your routine.</p>'}
function poolMarkup(){ensureExtraState();return `<details class="plan-day"><summary><span>Biceps exercise pool</span><span class="muted">${state.exercisePool.length} exercises</span></summary><p class="help">Tap an exercise to log it.</p>${state.exercisePool.map(n=>`<button class="poolitem" data-plan-log="${esc(n)}">${esc(n)} <span>＋</span></button>`).join('')}<button class="secondary" data-plan-pool="edit">Edit exercise pool</button></details>`}

const normalizedName=s=>String(s||'').trim().toLowerCase();
const toLb=(w,u)=>num(w)*(u==='kg'?2.20462262185:1);
const displayWeight=(lb,u)=>Math.round((u==='kg'?lb/2.20462262185:lb)*10)/10;
const unitFor=x=>x.unit==='kg'?'kg':'lb';
const exerciseNames=()=>[...new Map(state.sets.map(x=>[normalizedName(x.exercise),String(x.exercise).trim()])).values()].filter(Boolean).sort((a,b)=>a.localeCompare(b));
const workoutSummary=()=>{
 const all=state.sets, days=new Set(all.map(x=>x.date)).size, count=all.reduce((a,x)=>a+Math.max(1,num(x.sets)),0);
 return {days,count};
};
const trainingMarkup=()=>{
 let names=exerciseNames(), name=names.find(n=>normalizedName(n)===normalizedName(selectedExercise))||names[0]||'', matching=state.sets.filter(x=>normalizedName(x.exercise)===normalizedName(name));
 let unit=matching.length?unitFor(matching[matching.length-1]):'lb';
 let byDay={}; for(let x of matching){let w=toLb(x.weight,unitFor(x));if(w>0)byDay[x.date]=Math.max(byDay[x.date]||0,w)}
 let dates=Object.keys(byDay).sort().slice(-8), max=Math.max(0,...dates.map(d=>byDay[d])), best=matching.filter(x=>toLb(x.weight,unitFor(x))>0).sort((a,b)=>toLb(b.weight,unitFor(b))-toLb(a.weight,unitFor(a)))[0];
 let chart=dates.length?`<div class="trend">${dates.map(d=>`<div class="trendcol"><span>${displayWeight(byDay[d],unit)}</span><div class="trendbar" style="height:${Math.max(8,Math.round(byDay[d]/max*82))}px"></div><small>${esc(d.slice(5))}</small></div>`).join('')}</div><p class="help">Heaviest logged set per day in ${unit}. This is a weight record, not an estimated one-rep max.</p>`:'<p class="empty">Log a weighted set to see your progress here.</p>';
 let summary=workoutSummary();ensureExtraState();
 return `<h2 class="page">Put in work<span style="color:var(--lime)">.</span></h2><p class="sub">Every set is a step forward.</p><button class="primary" data-add="set">＋ Log workout sets</button><div class="metricgrid"><div class="card metric"><span class="label">TRAINING DAYS</span><strong>${summary.days}</strong></div><div class="card metric"><span class="label">SETS LOGGED</span><strong>${summary.count}</strong></div></div><div class="sectionhead"><h2>Strength progress</h2><small>BY EXERCISE</small></div><div class="card">${names.length?`<label class="field">Exercise<select id="progress-exercise">${names.map(n=>`<option ${normalizedName(n)===normalizedName(name)?'selected':''}>${esc(n)}</option>`).join('')}</select></label><div class="record"><span class="label">HEAVIEST SET</span><strong>${best?`${displayWeight(toLb(best.weight,unitFor(best)),unit)} <small>${unit} × ${num(best.reps)} reps</small>`:'—'}</strong></div>${chart}`:'<p class="empty">Log an exercise to start tracking your strength.</p>'}</div><div class="sectionhead"><h2>Your routine</h2><small>${state.dayPlans.length} DAYS</small></div><div class="card">${plansMarkup()}<button class="secondary" data-plan-add="new">＋ Add training day</button>${poolMarkup()}</div><div class="sectionhead"><h2>Body weight</h2><small>LAST 5 ENTRIES</small></div><div class="card">${bodyMarkup()}<button class="secondary" data-extra="body">＋ Add weigh-in</button></div><div class="sectionhead"><h2>Rest timer</h2><small>BETWEEN SETS</small></div><div class="card"><div class="row"><div><div class="label">TIME REMAINING</div><div id="timer-value" class="timer">${timerText()}</div></div><div><button class="smallbtn" data-timer="60">60s</button> <button class="smallbtn" data-timer="90">90s</button> <button class="smallbtn" data-timer="120">120s</button> <button class="smallbtn" data-timer="0">Reset</button></div></div><p class="help">The timer updates while the app is open; it does not send a background alert.</p></div><div class="sectionhead"><h2>Workout history</h2><small>ALL ENTRIES</small></div>${grouped(state.sets,setlist)}`;
};
function timerText(){let seconds=Math.max(0,Math.ceil((restEnd-Date.now())/1000));return `${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`}
const originalRender=render;render=function(){originalRender();if(page==='training')$('#content').innerHTML=trainingMarkup()};
const originalOpenModal=openModal;openModal=function(type){if(type!=='set')return originalOpenModal(type);$('#modalTitle').textContent='Log workout sets';$('#modalBody').innerHTML=`<form id="workoutform"><label class="field">Date<input type="date" name="date" required value="${today()}"></label><label class="field">Exercise<input list="known-exercises" name="exercise" required maxlength="100" placeholder="e.g. Bench press"><datalist id="known-exercises">${exerciseNames().map(n=>`<option value="${esc(n)}">`).join('')}</datalist></label><label class="field">Weight unit<select name="unit"><option>lb</option><option>kg</option></select></label><p class="help">Enter each set separately so you can change the weight and reps as you go.</p><div id="setrows"></div><button type="button" id="add-set-row" class="secondary">＋ Add another set</button><button class="primary">Save sets</button></form>`;let rows=$('#setrows');function addRow(copy){let index=rows.children.length+1,div=document.createElement('div');div.className='setrow';div.innerHTML=`<div class="row"><strong>SET ${index}</strong><button type="button" class="iconbtn remove-set" aria-label="Remove set">×</button></div><div class="grid"><label class="field">Weight<input name="weight" type="number" min="0" step="any" required value="${copy?.weight??0}"></label><label class="field">Reps<input name="reps" type="number" min="1" step="1" required value="${copy?.reps??10}"></label></div>`;rows.append(div)};addRow();$('#add-set-row').onclick=()=>{let prev=rows.lastElementChild;addRow({weight:prev.querySelector('[name=weight]').value,reps:prev.querySelector('[name=reps]').value})};rows.onclick=e=>{if(e.target.closest('.remove-set')){if(rows.children.length===1)return;e.target.closest('.setrow').remove();[...rows.children].forEach((x,i)=>x.querySelector('strong').textContent=`SET ${i+1}`)}};$('#workoutform').onsubmit=e=>{e.preventDefault();let f=e.currentTarget,date=f.elements.date.value,exercise=f.elements.exercise.value.trim(),unit=f.elements.unit.value;if(!exercise){alert('Enter an exercise name.');return}for(let row of rows.children){state.sets.push({id:crypto.randomUUID(),date,exercise,unit,weight:row.querySelector('[name=weight]').value,reps:row.querySelector('[name=reps]').value,sets:'1'})}selectedExercise=exercise;save();$('#modal').close();page='training';render()};$('#modal').showModal()};
document.addEventListener('click',e=>{let del=e.target.closest('[data-body-delete]'),extra=e.target.closest('[data-extra="body"]');if(del){ensureExtraState();if(confirm('Delete this weigh-in?')){state.body=state.body.filter(x=>x.id!==del.dataset.bodyDelete);save();render()}return}if(!extra)return;ensureExtraState();$('#modalTitle').textContent='Add weigh-in';$('#modalBody').innerHTML=`<form id="extraform"><label class="field">Date<input type="date" name="date" required value="${today()}"></label><div class="grid"><label class="field">Body weight<input type="number" name="weight" min="0.1" step="any" required></label><label class="field">Unit<select name="unit"><option>lb</option><option>kg</option></select></label></div><button class="primary">Save weigh-in</button></form>`;$('#extraform').onsubmit=ev=>{ev.preventDefault();let f=Object.fromEntries(new FormData(ev.currentTarget));f.id=crypto.randomUUID();state.body.push(f);save();$('#modal').close();render()};$('#modal').showModal()});
function editDay(index){ensureExtraState();let isNew=index===null,d=isNew?{name:'',priority:[],optional:[]}:state.dayPlans[index];if(!d)return;$('#modalTitle').textContent=isNew?'Add training day':'Edit training day';$('#modalBody').innerHTML=`<form id="dayform"><label class="field">Day name<input name="dayname" required maxlength="100" value="${esc(d.name)}" placeholder="e.g. Back + biceps"></label><label class="field">Priority exercises — one per line<textarea name="priority" rows="8" placeholder="One exercise per line">${esc(d.priority.join('\n'))}</textarea></label><label class="field">Optional exercises — one per line<textarea name="optional" rows="6" placeholder="One exercise per line">${esc(d.optional.join('\n'))}</textarea></label><p class="help">Add, remove, or reorder exercises by editing these lists. The order you enter is the order shown.</p><button class="primary">Save day</button></form>`;$('#dayform').onsubmit=ev=>{ev.preventDefault();let f=new FormData(ev.currentTarget),lines=k=>String(f.get(k)).split(/\r?\n/).map(x=>x.trim()).filter(Boolean),day={name:String(f.get('dayname')).trim(),priority:lines('priority'),optional:lines('optional')};if(!day.name){alert('Enter a day name.');return}if(isNew)state.dayPlans.push(day);else state.dayPlans[index]=day;save();$('#modal').close();render()};$('#modal').showModal()}
function editPool(){ensureExtraState();$('#modalTitle').textContent='Edit biceps pool';$('#modalBody').innerHTML=`<form id="poolform"><label class="field">Exercises — one per line<textarea name="pool" rows="14">${esc(state.exercisePool.join('\n'))}</textarea></label><button class="primary">Save exercise pool</button></form>`;$('#poolform').onsubmit=ev=>{ev.preventDefault();state.exercisePool=String(new FormData(ev.currentTarget).get('pool')).split(/\r?\n/).map(x=>x.trim()).filter(Boolean);save();$('#modal').close();render()};$('#modal').showModal()}
document.addEventListener('click',e=>{let log=e.target.closest('[data-plan-log]'),add=e.target.closest('[data-plan-add]'),edit=e.target.closest('[data-plan-edit]'),del=e.target.closest('[data-plan-delete]'),move=e.target.closest('[data-plan-move]'),pool=e.target.closest('[data-plan-pool]');if(log){openModal('set');$('#workoutform [name=exercise]').value=log.dataset.planLog;return}if(add){editDay(null);return}if(edit){editDay(Number(edit.dataset.planEdit));return}if(pool){editPool();return}if(del){let i=Number(del.dataset.planDelete);if(confirm(`Remove ${state.dayPlans[i].name} from your routine? Your workout history will remain.`)){state.dayPlans.splice(i,1);save();render()}return}if(move){let i=Number(move.dataset.planMove),j=i+Number(move.dataset.dir);if(j>=0&&j<state.dayPlans.length){[state.dayPlans[i],state.dayPlans[j]]=[state.dayPlans[j],state.dayPlans[i]];save();render()}}});
document.addEventListener('change',e=>{if(e.target.id==='progress-exercise'){selectedExercise=e.target.value;render()}});
document.addEventListener('click',e=>{let b=e.target.closest('[data-timer]');if(!b)return;let duration=num(b.dataset.timer);restEnd=duration?Date.now()+duration*1000:0;clearInterval(restHandle);let update=()=>{let el=$('#timer-value');if(el)el.textContent=timerText();if(restEnd&&Date.now()>=restEnd){restEnd=0;clearInterval(restHandle)}};update();if(duration)restHandle=setInterval(update,250)});

render();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>

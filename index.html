const key='forge-fitness-v1';const defaults={goals:{calories:2200,protein:150,carbs:250,fat:70},foods:[],sets:[]};let state;try{state=JSON.parse(localStorage.getItem(key))||structuredClone(defaults);if(!state.goals||!Array.isArray(state.foods)||!Array.isArray(state.sets))throw 0}catch{state=structuredClone(defaults)}let page='home';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(key,JSON.stringify(state));const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const num=v=>Number(v)||0;const sum=(items,k)=>items.reduce((a,x)=>a+num(x[k]),0);const datefmt=d=>{let [y,m,day]=d.split('-');return new Date(+y,+m-1,+day).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})};const foodlist=(items)=>items.length?items.map(x=>`<div class="entry row"><div><strong>${esc(x.name)}</strong><small>${esc(x.meal)} · ${num(x.calories)} kcal · ${num(x.protein)}g protein</small></div><button class="iconbtn" data-delete="food" data-id="${esc(x.id)}" aria-label="Delete ${esc(x.name)}">×</button></div>`).join(''):'<p class="empty">Nothing logged yet. Your next small step starts here.</p>';const setlist=(items)=>items.length?items.map(x=>`<div class="entry row"><div><strong>${esc(x.exercise)}</strong><small>${num(x.sets)} sets × ${num(x.reps)} reps · ${num(x.weight)} ${esc(x.unit)}</small></div><button class="iconbtn" data-delete="set" data-id="${esc(x.id)}" aria-label="Delete ${esc(x.exercise)}">×</button></div>`).join(''):'<p class="empty">No exercises logged yet. Time to put in work.</p>';const grouped=(items,renderer)=>{let dates=[...new Set(items.map(x=>x.date))].sort().reverse();return dates.length?dates.map(d=>`<div class="historydate">${datefmt(d)}</div><div class="card">${renderer(items.filter(x=>x.date===d).reverse())}</div>`).join(''):`<div class="card">${renderer([])}</div>`};
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let foods=state.foods.filter(x=>x.date===today()),sets=state.sets.filter(x=>x.date===today()),cal=sum(foods,'calories'),g=state.goals;let macro=(name,k)=>`<div><div class="label">${name}</div><div class="bar"><span style="width:${Math.min(100,num(g[k])?sum(foods,k)/num(g[k])*100:0)}%"></span></div><strong>${sum(foods,k)} <span class="label">/ ${num(g[k])}g</span></strong></div>`;if(page==='home')$('#content').innerHTML=`<section class="hero"><div class="eyebrow">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div><h1>SHOW UP.<br>LEVEL UP<span style="color:var(--lime)">.</span></h1><p>Build the body. Track the process.</p></section><div class="card"><div class="cardtop"><div><div class="label">TODAY'S FUEL</div><div class="big">${cal.toLocaleString()} <small>kcal</small></div><div class="label">${Math.max(0,num(g.calories)-cal).toLocaleString()} kcal remaining · Goal ${num(g.calories).toLocaleString()}</div></div><div class="ring" style="--progress:${Math.min(100,num(g.calories)?cal/num(g.calories)*100:0)}%" data-text="${Math.round(num(g.calories)?cal/num(g.calories)*100:0)}%"></div></div><div class="macrogrid">${macro('PROTEIN','protein')}${macro('CARBS','carbs')}${macro('FAT','fat')}</div></div><div class="sectionhead"><h2>Make it count</h2><small>QUICK ACTIONS</small></div><div class="quick"><button class="action" data-add="food"><span>＋</span>Log food</button><button class="action alt" data-add="set"><span>↗</span>Log exercise</button></div><div class="sectionhead"><h2>Today's training</h2><small>${sets.length} EXERCISES</small></div><div class="card">${setlist([...sets].reverse())}</div><div class="sectionhead"><h2>Today's fuel</h2><small>${foods.length} ENTRIES</small></div><div class="card">${foodlist([...foods].reverse())}</div>`;if(page==='food')$('#content').innerHTML=`<h2 class="page">Fuel your work<span style="color:var(--lime)">.</span></h2><p class="sub">Every meal is part of the plan.</p><button class="primary" data-add="food">＋ Log food</button><div class="sectionhead"><h2>Food history</h2><small>ALL ENTRIES</small></div>${grouped(state.foods,foodlist)}`;if(page==='training')$('#content').innerHTML=`<h2 class="page">Put in work<span style="color:var(--lime)">.</span></h2><p class="sub">Record the reps. See the progress.</p><button class="primary" data-add="set">＋ Log exercise</button><div class="sectionhead"><h2>Training history</h2><small>ALL ENTRIES</small></div>${grouped(state.sets,setlist)}`;if(page==='settings')$('#content').innerHTML=`<h2 class="page">Your setup<span style="color:var(--lime)">.</span></h2><p class="sub">Make the numbers work for you.</p><div class="card"><h3>Daily targets</h3><p class="help">Starting placeholders—set these to your own goals.</p><form id="goals">${['calories','protein','carbs','fat'].map(k=>`<label class="field">${k[0].toUpperCase()+k.slice(1)} ${k==='calories'?'(kcal)':'(g)'}<input required type="number" min="0" step="1" name="${k}" value="${num(g[k])}"></label>`).join('')}<button class="primary">Save targets</button></form></div><div class="card"><h3>Your data</h3><p class="help">Entries are stored on this device. Export a backup regularly; clearing browser or web app data can erase them. Import replaces current entries.</p><button class="secondary" id="export">Export backup</button><label class="secondary" style="display:block;text-align:center;cursor:pointer">Import backup<input id="import" type="file" accept="application/json" hidden></label></div>`}
function openModal(type){$('#modalTitle').textContent=type==='food'?'Log food':'Log exercise';let date=`<label class="field">Date<input type="date" name="date" required value="${today()}"></label>`;let food=`<label class="field">Food or meal<input name="name" required maxlength="100" placeholder="e.g. Chicken and rice"></label><label class="field">Meal<select name="meal"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option></select></label><div class="grid">${[['calories','Calories (kcal)'],['protein','Protein (g)'],['carbs','Carbs (g)'],['fat','Fat (g)']].map(([k,l])=>`<label class="field">${l}<input type="number" min="0" step="any" name="${k}" value="0" required></label>`).join('')}</div>`;let exercise=`<label class="field">Exercise<input name="exercise" required maxlength="100" placeholder="e.g. Bench press"></label><div class="grid"><label class="field">Sets<input type="number" min="1" step="1" name="sets" value="3" required></label><label class="field">Reps per set<input type="number" min="1" step="1" name="reps" value="10" required></label><label class="field">Weight<input type="number" min="0" step="any" name="weight" value="0" required></label><label class="field">Unit<select name="unit"><option>lb</option><option>kg</option></select></label></div><p class="help">For sets with different weights or reps, log a separate entry for each.</p>`;$('#modalBody').innerHTML=`<form id="entryform">${date}${type==='food'?food:exercise}<button class="primary">Save ${type==='food'?'food':'exercise'}</button></form>`;$('#entryform').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));data.id=crypto.randomUUID();(type==='food'?state.foods:state.sets).push(data);save();$('#modal').close();render()};$('#modal').showModal()}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-page]'),add=e.target.closest('[data-add]'),del=e.target.closest('[data-delete]');if(nav){page=nav.dataset.page;render();window.scrollTo(0,0)}if(add)openModal(add.dataset.add);if(del&&confirm('Delete this entry?')){let arr=del.dataset.delete==='food'?'foods':'sets';state[arr]=state[arr].filter(x=>x.id!==del.dataset.id);save();render()}if(e.target.id==='close')$('#modal').close();if(e.target.id==='export'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download=`forge-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}});document.addEventListener('submit',e=>{if(e.target.id==='goals'){e.preventDefault();let f=new FormData(e.target);for(let k of ['calories','protein','carbs','fat'])state.goals[k]=num(f.get(k));save();alert('Targets saved.');render()}});document.addEventListener('change',async e=>{if(e.target.id==='import'&&e.target.files[0]){try{let data=JSON.parse(await e.target.files[0].text());if(!data.goals||!Array.isArray(data.foods)||!Array.isArray(data.sets))throw Error();if(confirm('Replace your current entries and targets with this backup?')){state=data;save();render()}}catch{alert('Could not read that backup.')}}});

const normalizedName=s=>String(s||'').trim().toLowerCase();
const toLb=(w,u)=>num(w)*(u==='kg'?2.20462262185:1);

const unitFor=x=>x.unit==='kg'?'kg':'lb';

const workoutSummary=()=>{

};
const trainingMarkup=()=>{

 let dates=Object.keys(byDay).sort().slice(-8), max=Math.max(0,...dates.map(d=>byDay[d])), best=matching.filter(x=>toLb(x.weight,unitFor(x))>0).sort((a,b)=>toLb(b.weight,unitFor(b))-toLb(a.weight,unitFor(a)))[0];
 let chart=dates.length?`<div class="trend">${dates.map(d=>`<div class="trendcol"><span>${displayWeight(byDay[d],unit)}</span><div class="trendbar" style="height:${Math.max(8,Math.round(byDay[d]/max*82))}px"></div><small>${esc(d.slice(5))}</small></div>`).join('')}</div><p class="help">Heaviest logged set per day in ${unit}. This is a weight record, not an estimated one-rep max.</p>`:'<p class="empty">Log a weighted set to see your progress here.</p>';

sectionhead"><h2>Workout history</h2><small>ALL ENTRIES</small></div>${grouped(state.sets,setlist)}`;
};

document.addEventListener('click',e=>{let log=e.target.closest('[data-plan-log]'),add=e.target.closest('[data-plan-add]'),edit=e.target.closest('[data-plan-edit]'),del=e.target.closest('[data-plan-delete]'),move=e.target.closest('[data-plan-move]'),pool=e.target.closest('[data-plan-pool]');if(log){let ex=findExercise(log.dataset.planLog);if(ex?.category==='cardio')openCardio(log.dataset.planLog);else{openModal('set');$('#workoutform [name=exercise]').value=log.dataset.planLog}return}if(add){editDay(null);return}if(edit){editDay(Number(edit.dataset.planEdit));return}if(pool){editPool();return}if(del){let i=Number(del.dataset.planDelete);if(confirm(`Remove ${state.dayPlans[i].name} from your routine? Your workout history will remain.`)){state.dayPlans.splice(i,1);save();render()}return}if(move){let i=Number(move.dataset.planMove),j=i+Number(move.dataset.dir);if(j>=0&&j<state.dayPlans.length){[state.dayPlans[i],state.dayPlans[j]]=[state.dayPlans[j],state.dayPlans[i]];save();render()}}});

function libraryView(){let all=libraryAll(),equip=[...new Set(all.map(e=>e.equipment).filter(Boolean))].sort();return `<div class="card"><p class="help">${catalog.length?`${catalog.length} exercises from Free Exercise DB, plus cardio and your custom exercises.`:catalogError?'The offline exercise library could not be loaded. Check your connection and reopen the app.':'Loading exercise library…'}</p><label class="field">Search<input id="library-search" type="search" value="${esc(libraryQuery)}" placeholder="Exercise, equipment, category"></label><div class="grid"><label class="field">Muscle / type<select id="library-muscle"><option value="all">All muscles</option><option value="cardio" ${libraryMuscle==='cardio'?'selected':''}>Cardio</option>${MUSCLES.map(m=>`<option value="${m}" ${libraryMuscle===m?'selected':''}>${pretty(m)}</option>`).join('')}</select></label><label class="field">Equipment<select id="library-equipment"><option value="all">All equipment</option>${equip.map(e=>`<option value="${esc(e)}" ${libraryEquipment===e?'selected':''}>${esc(pretty(e))}</option>`).join('')}</select></label></div><button class="secondary" data-custom-add="1">＋ Create custom exercise</button></div><div id="library-results">${libraryItems()}</div><p class="help">Exercise data: <a href="https://github.com/yuhonas/free-exercise-db" target="_blank" rel="noopener" style="color:var(--lime)">Free Exercise DB</a> (Unlicense). Muscle classifications are general guides.</p>`}
function analysisView(){let cutoff=dateDaysAgo(6),end=today(),matching=state.sets.filter(s=>setMuscle(s)===analysisMuscle),recent=matching.filter(s=>s.date>=cutoff&&s.date<=end),unclassified=state.sets.filter(s=>!setMuscle(s)).length,unique=[...new Set(matching.map(s=>s.exercise))],weekSets=recent.reduce((a,s)=>a+Math.max(1,num(s.sets)),0);let rows=unique.map(n=>{let entries=matching.filter(s=>s.exercise===n),weighted=entries.filter(x=>num(x.weight)>0).sort((a,b)=>toLb(b.weight,unitFor(b))-toLb(a.weight,unitFor(a))),best=weighted[0],last=[...entries].sort((a,b)=>b.date.localeCompare(a.date))[0];return `<div class="entry row"><div><strong>${esc(n)}</strong><small>${best?`Heaviest: ${num(best.weight)} ${esc(unitFor(best))} × ${num(best.reps)} reps`:'No external weight logged'} · Last: ${datefmt(last.date)}</small></div><button class="smallbtn" data-assign-muscle="${esc(n)}">Change target</button></div>`}).join('');let missing=[...new Set(state.sets.filter(s=>!setMuscle(s)).map(s=>s.exercise))];return `<div class="card"><label class="field">Choose a muscle<select id="analysis-muscle">${MUSCLES.map(m=>`<option value="${m}" ${m===analysisMuscle?'selected':''}>${pretty(m)}</option>`).join('')}</select></label><div class="metricgrid"><div class="card metric"><span class="label">SETS · LAST 7 DAYS</span><strong>${weekSets}</strong></div><div class="card metric"><span class="label">EXERCISES · ALL TIME</span><strong>${unique.length}</strong></div></div><p class="help">Counts use the primary muscle assigned to each logged set. A set may work other muscles too. These numbers describe training, not muscle growth.</p>${unclassified?`<p class="help">${unclassified} logged entries have no assigned or recognized primary muscle and are excluded. New logs let you choose one.</p>`:''}</div><div class="sectionhead"><h2>${pretty(analysisMuscle)} progress</h2><small>BY EXERCISE</small></div><div class="card">${rows||'<p class="empty">No matching sets yet. Log an exercise and choose its primary muscle.</p>'}</div>${missing.length?`<div class="sectionhead"><h2>Unassigned exercises</h2></div><div class="card">${missing.map(n=>`<div class="entry row"><strong>${esc(n)}</strong><button class="smallbtn" data-assign-muscle="${esc(n)}">Assign target</button></div>`).join('')}</div>`:''}<div class="sectionhead"><h2>Exercise trend</h2><small>HEAVIEST SET PER DAY</small></div><div class="card">${namesTrend(matching)}</div>`}
function namesTrend(matching){let names=[...new Set(matching.map(s=>s.exercise))];if(!names.length)return '<p class="empty">Your exercise trend will appear after you log weighted sets.</p>';if(!names.includes(selectedExercise))selectedExercise=names[0];let entries=matching.filter(s=>s.exercise===selectedExercise),unit=unitFor(entries[entries.length-1]),byDay={};for(let e of entries){let w=toLb(e.weight,unitFor(e));if(w>0)byDay[e.date]=Math.max(byDay[e.date]||0,w)}let dates=Object.keys(byDay).sort().slice(-8),max=Math.max(0,...dates.map(d=>byDay[d]));return `<label class="field">Exercise<select id="progress-exercise">${names.map(n=>`<option ${n===selectedExercise?'selected':''}>${esc(n)}</option>`).join('')}</select></label>${dates.length?`<div class="trend">${dates.map(d=>`<div class="trendcol"><span>${displayWeight(byDay[d],unit)}</span><div class="trendbar" style="height:${Math.max(8,Math.round(byDay[d]/max*82))}px"></div><small>${esc(d.slice(5))}</small></div>`).join('')}</div><p class="help">Heaviest logged set each day (${unit}); not an estimated 1RM.</p>`:'<p class="empty">Log external weight to see a trend.</p>'}`}
function historyView(){let cardio=state.cardio.length?state.cardio.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="entry row"><div><strong>${esc(x.name)}</strong><small>${datefmt(x.date)} · ${num(x.minutes)} min${x.distance?` · ${num(x.distance)} ${esc(x.unit)}`:''}</small></div><button class="iconbtn" data-cardio-delete="${esc(x.id)}" aria-label="Delete cardio entry">×</button></div>`).join(''):'<p class="empty">No cardio logged yet.</p>';return `<div class="sectionhead"><h2>Strength history</h2><small>ALL ENTRIES</small></div>${grouped(state.sets,setlist)}<div class="sectionhead"><h2>Cardio history</h2><button class="smallbtn" data-cardio-add="1">＋ Log</button></div><div class="card">${cardio}</div>`}
const previousRender=render;
render=function(){previousRender();if(page!=='training')return;ensureExtraState();const labels=[['overview','Overview'],['routine','Routine'],['library','Exercises'],['analysis','Analysis'],['history','History']];$('#content').innerHTML=`<h2 class="page">Training<span style="color:var(--lime)">.</span></h2><p class="sub">Your plan. Your progress.</p><div class="training-tabs" role="tablist">${labels.map(([id,label])=>`<button role="tab" aria-selected="${id===trainingTab}" class="${id===trainingTab?'active':''}" data-training-tab="${id}">${label}</button>`).join('')}</div>${trainingTab==='overview'?trainingOverview():trainingTab==='routine'?routineView():trainingTab==='library'?libraryView():trainingTab==='analysis'?analysisView():historyView()}`};
const oldModal=openModal;
openModal=function(type){oldModal(type);if(type!=='set')return;let form=$('#workoutform'),help=form.querySelector('p.help'),label=document.createElement('label');label.className='field';label.innerHTML=`Primary muscle <select name="muscle"><option value="">Unassigned</option>${MUSCLES.map(m=>`<option value="${m}">${pretty(m)}</option>`).join('')}</select>`;help.before(label);let exercise=form.querySelector('[name=exercise]'),sel=form.querySelector('[name=muscle]');exercise.addEventListener('change',()=>{sel.value=primaryFor(exercise.value)});let submit=form.onsubmit;form.onsubmit=e=>{let target=sel.value,before=state.sets.length;submit(e);if(state.sets.length>before){state.sets.slice(before).forEach(s=>s.muscle=target);save()}}};
function prefillWorkout(name){openModal('set');let form=$('#workoutform');form.elements.exercise.value=name;form.elements.muscle.value=primaryFor(name)}
function openCardio(name=''){ensureExtraState();$('#modalTitle').textContent='Log cardio';$('#modalBody').innerHTML=`<form id="cardioform"><label class="field">Date<input type="date" name="date" value="${today()}" required></label><label class="field">Activity<input name="name" required maxlength="100" value="${esc(name)}" placeholder="e.g. Walking, Cycling"></label><label class="field">Duration (minutes)<input name="minutes" type="number" min="0.1" step="any" required></label><div class="grid"><label class="field">Distance (optional)<input name="distance" type="number" min="0" step="any"></label><label class="field">Distance unit<select name="unit"><option>mi</option><option>km</option><option>m</option></select></label></div><button class="primary">Save cardio</button></form>`;$('#cardioform').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.currentTarget));x.name=x.name.trim();if(!x.name)return;x.id=crypto.randomUUID();state.cardio.push(x);save();$('#modal').close();trainingTab='history';render()};$('#modal').showModal()}
function addToDay(name){ensureExtraState();$('#modalTitle').textContent='Add to routine';if(!state.dayPlans.length){$('#modalBody').innerHTML='<p class="help">Create a training day in Routine first.</p>';$('#modal').showModal();return}$('#modalBody').innerHTML=`<form id="addtoday"><p>${esc(name)}</p><label class="field">Training day<select name="day">${state.dayPlans.map((d,i)=>`<option value="${i}">${esc(d.name)}</option>`).join('')}</select></label><label class="field">Section<select name="section"><option value="priority">Priority</option><option value="optional">Optional</option></select></label><button class="primary">Add exercise</button></form>`;$('#addtoday').onsubmit=e=>{e.preventDefault();let f=new FormData(e.currentTarget),day=state.dayPlans[Number(f.get('day'))];day[f.get('section')].push(name);save();$('#modal').close();render()};$('#modal').showModal()}
function newRoutine(){ensureExtraState();$('#modalTitle').textContent='New routine';$('#modalBody').innerHTML=`<form id="routineform"><label class="field">Routine name<input name="name" required maxlength="100" placeholder="e.g. Three-day split"></label><label class="field">Start with<select name="days"><option value="3">3 empty days</option><option value="1">1 empty day</option><option value="2">2 empty days</option><option value="4">4 empty days</option><option value="5">5 empty days</option><option value="6">6 empty days</option><option value="7">7 empty days</option><option value="0">Empty routine</option><option value="copy">Copy current routine</option></select></label><button class="primary">Create routine</button></form>`;$('#routineform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.currentTarget),name=String(f.get('name')).trim(),n=f.get('days');if(!name)return;let days=n==='copy'?structuredClone(state.dayPlans):Array.from({length:Number(n)},(_,i)=>({name:`Day ${i+1}`,priority:[],optional:[]}));let id=crypto.randomUUID();state.routines.push({id,name,days});state.activeRoutine=id;state.dayPlans=days;save();$('#modal').close();render()};$('#modal').showModal()}
function customExercise(){ensureExtraState();$('#modalTitle').textContent='Custom exercise';$('#modalBody').innerHTML=`<form id="customform"><label class="field">Name<input name="name" required maxlength="100"></label><label class="field">Primary muscle<select name="muscle"><option value="">Unassigned</option>${MUSCLES.map(m=>`<option value="${m}">${pretty(m)}</option>`).join('')}</select></label><label class="field">Type<select name="category"><option value="strength">Strength</option><option value="cardio">Cardio</option><option value="stretching">Stretching</option></select></label><label class="field">Equipment<input name="equipment" maxlength="60" placeholder="e.g. cable"></label><button class="primary">Save exercise</button></form>`;$('#customform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.currentTarget),name=String(f.get('name')).trim();if(!name)return;if(libraryAll().some(x=>normalizedName(x.name)===normalizedName(name))){alert('An exercise with that name already exists.');return}state.customExercises.push({name,primary:f.get('muscle')?[f.get('muscle')]:[],secondary:[],category:String(f.get('category')),equipment:String(f.get('equipment')).trim()||'varies',instructions:[],custom:true});save();$('#modal').close();libraryQuery=name;libraryMuscle='all';libraryEquipment='all';libraryPage=0;render()};$('#modal').showModal()}
function assignMuscle(name){$('#modalTitle').textContent='Assign primary muscle';$('#modalBody').innerHTML=`<form id="assignform"><p>${esc(name)}</p><p class="help">This updates the primary muscle for all existing sets logged under this exact exercise name.</p><label class="field">Primary muscle<select name="muscle"><option value="">Unassigned</option>${MUSCLES.map(m=>`<option value="${m}" ${m===primaryFor(name)?'selected':''}>${pretty(m)}</option>`).join('')}</select></label><button class="primary">Update target</button></form>`;$('#assignform').onsubmit=e=>{e.preventDefault();let value=String(new FormData(e.currentTarget).get('muscle'));state.sets.filter(x=>x.exercise===name).forEach(x=>x.muscle=value);save();$('#modal').close();render()};$('#modal').showModal()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-assign-muscle]');if(b)assignMuscle(b.dataset.assignMuscle)});
function infoExercise(name){let e=findExercise(name);if(!e)return;$('#modalTitle').textContent=e.name;$('#modalBody').innerHTML=`<p class="help">${esc(pretty(e.category))} · ${esc(pretty(e.equipment))}</p><p>Primary: ${esc((e.primary||[]).map(pretty).join(', ')||'not specified')}</p><p class="help">Secondary: ${esc((e.secondary||[]).map(pretty).join(', ')||'not specified')}</p>${e.instructions?.length?`<ol class="instructions">${e.instructions.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:'<p class="help">No instructions supplied for this activity.</p>'}<button class="primary" data-modal-add="${esc(e.name)}">＋ Add to routine</button>`;$('#modal').showModal()}
document.addEventListener('click',e=>{let a=e.target.closest('[data-training-tab]');if(a){trainingTab=a.dataset.trainingTab;render();return}let plan=e.target.closest('[data-plan-log]');if(plan){let form=$('#workoutform');if(form?.elements.muscle)form.elements.muscle.value=primaryFor(plan.dataset.planLog);return}let action=e.target.closest('[data-lib-log],[data-lib-info],[data-lib-add],[data-modal-add],[data-cardio-add],[data-cardio-delete],[data-lib-prev],[data-lib-next],[data-custom-add],[data-custom-remove],[data-routine-new],[data-routine-rename],[data-routine-delete]');if(!action)return;let d=action.dataset;if('libLog'in d){let ex=findExercise(d.libLog);ex?.category==='cardio'?openCardio(ex.name):prefillWorkout(d.libLog)}else if('libInfo'in d)infoExercise(d.libInfo);else if('libAdd'in d||'modalAdd'in d){if($('#modal').open)$('#modal').close();addToDay(d.libAdd||d.modalAdd)}else if('cardioAdd'in d)openCardio();else if('cardioDelete'in d){if(confirm('Delete this cardio entry?')){state.cardio=state.cardio.filter(x=>x.id!==d.cardioDelete);save();render()}}else if('libPrev'in d){libraryPage=Math.max(0,libraryPage-1);$('#library-results').innerHTML=libraryItems()}else if('libNext'in d){libraryPage++;$('#library-results').innerHTML=libraryItems()}else if('customAdd'in d)customExercise();else if('customRemove'in d){if(confirm('Remove this custom exercise? Your logs and routines will remain.')){state.customExercises=state.customExercises.filter(x=>x.name!==d.customRemove);save();render()}}else if('routineNew'in d)newRoutine();else if('routineRename'in d){let r=state.routines.find(x=>x.id===state.activeRoutine),name=prompt('Routine name',r.name);if(name?.trim()){r.name=name.trim().slice(0,100);save();render()}}else if('routineDelete'in d){let r=state.routines.find(x=>x.id===state.activeRoutine);if(state.routines.length>1&&confirm(`Delete “${r.name}”? Workout history will remain.`)){state.routines=state.routines.filter(x=>x.id!==r.id);state.activeRoutine=state.routines[0].id;state.dayPlans=state.routines[0].days;save();render()}}});
document.addEventListener('input',e=>{if(e.target.id==='library-search'){libraryQuery=e.target.value;libraryPage=0;$('#library-results').innerHTML=libraryItems()}});
document.addEventListener('change',e=>{if(e.target.id==='library-muscle'){libraryMuscle=e.target.value;libraryPage=0;$('#library-results').innerHTML=libraryItems()}else if(e.target.id==='library-equipment'){libraryEquipment=e.target.value;libraryPage=0;$('#library-results').innerHTML=libraryItems()}else if(e.target.id==='analysis-muscle'){analysisMuscle=e.target.value;selectedExercise='';render()}else if(e.target.id==='routine-select'){ensureExtraState();state.activeRoutine=e.target.value;state.dayPlans=state.routines.find(x=>x.id===state.activeRoutine).days;save();render()}});
fetch('./exercises.json').then(r=>{if(!r.ok)throw Error('library unavailable');return r.json()}).then(data=>{if(!Array.isArray(data))throw Error('invalid library');catalog=data;if(page==='training'&&['library','analysis'].includes(trainingTab))render()}).catch(()=>{catalogError=true;if(page==='training'&&trainingTab==='library')render()});

// Routine builder: per-exercise controls and a multi-select picker.
let expandedRoutineDay=-1, picker=null;
function getDetails(day,name){return Array.isArray(day.details)?day.details.find(x=>x.name===name)||null:null}
function setDetails(day,name,data){if(!Array.isArray(day.details))day.details=[];day.details=day.details.filter(x=>x.name!==name);if(data&&Object.values(data).some(x=>String(x||'').trim()))day.details.push({name,...data})}
function forgetUnusedDetails(day,name){if(![...day.priority,...day.optional].includes(name))setDetails(day,name,null)}
function movePlanExercise(dayIndex,section,index,delta){let list=state.dayPlans[dayIndex]?.[section],target=index+delta;if(!list||index<0||index>=list.length||target<0||target>=list.length)return false;[list[index],list[target]]=[list[target],list[index]];return true}
function removePlanExercise(dayIndex,section,index){let day=state.dayPlans[dayIndex];if(!day||!day[section]||index<0||index>=day[section].length)return null;let [name]=day[section].splice(index,1);forgetUnusedDetails(day,name);return name}
function transferPlanExercise(sourceDay,section,index,destDay,destSection,copy){let from=state.dayPlans[sourceDay],to=state.dayPlans[destDay];if(!from||!to||!['priority','optional'].includes(section)||!['priority','optional'].includes(destSection)||index<0||index>=from[section].length)return false;if(sourceDay===destDay&&section===destSection&&!copy)return false;let name=from[section][index],details=getDetails(from,name);if(!copy)removePlanExercise(sourceDay,section,index);to[destSection].push(name);if(details&&!getDetails(to,name))setDetails(to,name,{sets:details.sets||'',reps:details.reps||'',rest:details.rest||'',notes:details.notes||''});return true}
function selectedExerciseText(day,name){let d=getDetails(day,name);if(!d)return '';let pieces=[];if(d.sets)pieces.push(`${esc(d.sets)} sets`);if(d.reps)pieces.push(`${esc(d.reps)} reps`);if(d.rest)pieces.push(`${esc(d.rest)}s rest`);return `<div class="routine-prescription">${pieces.join(' · ')}${d.notes?`${pieces.length?' · ':''}${esc(d.notes)}`:''}</div>`}
plansMarkup=function(){ensureExtraState();function section(day,dayIndex,key){let list=day[key],start=key==='optional'?day.priority.length+1:1;if(!list.length)return '<p class="help">No exercises in this section yet.</p>';return `<ol class="planlist builder-list" start="${start}">${list.map((name,i)=>`<li><div class="routine-exercise"><button class="routine-name" data-plan-log="${esc(name)}">${esc(name)} <span>＋ log</span></button>${selectedExerciseText(day,name)}<div class="exercise-actions"><button class="smallbtn" data-ex-action="up" data-day="${dayIndex}" data-section="${key}" data-index="${i}" ${i===0?'disabled':''} aria-label="Move ${esc(name)} up">↑</button><button class="smallbtn" data-ex-action="down" data-day="${dayIndex}" data-section="${key}" data-index="${i}" ${i===list.length-1?'disabled':''} aria-label="Move ${esc(name)} down">↓</button><button class="smallbtn" data-ex-action="edit" data-day="${dayIndex}" data-section="${key}" data-index="${i}" aria-label="Edit ${esc(name)}">Edit</button><button class="smallbtn" data-ex-action="transfer" data-day="${dayIndex}" data-section="${key}" data-index="${i}" aria-label="Move or copy ${esc(name)}">Move / copy</button><button class="smallbtn" data-ex-action="remove" data-day="${dayIndex}" data-section="${key}" data-index="${i}" aria-label="Remove ${esc(name)}">Remove</button></div></div></li>`).join('')}</ol>`}
return state.dayPlans.map((day,i)=>`<details class="plan-day routine-day" data-routine-index="${i}" ${expandedRoutineDay===i?'open':''}><summary><span>${esc(day.name)}</span><span class="muted">${day.priority.length+day.optional.length} exercises</span></summary><div class="plan-actions"><button class="smallbtn" data-plan-edit="${i}">Rename / bulk edit</button><button class="smallbtn" data-plan-move="${i}" data-dir="-1" ${i===0?'disabled':''} aria-label="Move ${esc(day.name)} up">↑ Day</button><button class="smallbtn" data-plan-move="${i}" data-dir="1" ${i===state.dayPlans.length-1?'disabled':''} aria-label="Move ${esc(day.name)} down">↓ Day</button><button class="smallbtn" data-day-copy="${i}">Copy day</button><button class="smallbtn" data-plan-delete="${i}">Remove day</button></div><p class="eyebrow">PRIORITY WORK</p>${section(day,i,'priority')}<button class="add-exercises" data-open-picker="${i}" data-section="priority">＋ Add priority exercises</button><p class="eyebrow">IF YOU HAVE MORE TIME</p>${section(day,i,'optional')}<button class="add-exercises" data-open-picker="${i}" data-section="optional">＋ Add optional exercises</button></details>`).join('')||'<p class="empty">Add a training day to build your routine.</p>'};
// Keep saved per-exercise notes when bulk editing an existing day.
editDay=function(index){ensureExtraState();let fresh=index===null,d=fresh?{name:'',priority:[],optional:[]}:state.dayPlans[index];if(!d)return;$('#modalTitle').textContent=fresh?'Add training day':'Rename / bulk edit day';$('#modalBody').innerHTML=`<form id="dayform"><label class="field">Day name<input name="dayname" required maxlength="100" value="${esc(d.name)}" placeholder="e.g. Back + biceps"></label><label class="field">Priority exercises — one per line<textarea name="priority" rows="7">${esc(d.priority.join('\n'))}</textarea></label><label class="field">Optional exercises — one per line<textarea name="optional" rows="5">${esc(d.optional.join('\n'))}</textarea></label><p class="help">You can also add, move and edit exercises directly on the day. Prescriptions stay attached to names that remain on this day.</p><button class="primary">Save day</button></form>`;$('#dayform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.currentTarget),lines=k=>String(f.get(k)).split(/\r?\n/).map(x=>x.trim()).filter(Boolean),name=String(f.get('dayname')).trim();if(!name)return;let day={...d,name,priority:lines('priority'),optional:lines('optional')};if(Array.isArray(day.details))day.details=day.details.filter(x=>[...day.priority,...day.optional].includes(x.name));if(fresh){state.dayPlans.push(day);expandedRoutineDay=state.dayPlans.length-1}else{state.dayPlans[index]=day;expandedRoutineDay=index}save();$('#modal').close();render()};$('#modal').showModal()};
function editPlanExercise(dayIndex,section,index){let day=state.dayPlans[dayIndex],old=day?.[section]?.[index];if(!old)return;let details=getDetails(day,old)||{};$('#modalTitle').textContent='Edit exercise';$('#modalBody').innerHTML=`<form id="exerciseedit"><label class="field">Exercise name<input name="name" value="${esc(old)}" required maxlength="100"></label><div class="grid"><label class="field">Planned sets<input type="number" name="sets" min="1" step="1" value="${esc(details.sets||'')}" placeholder="e.g. 3"></label><label class="field">Rep target<input name="reps" maxlength="40" value="${esc(details.reps||'')}" placeholder="e.g. 8–12"></label></div><label class="field">Rest target (seconds)<input name="rest" type="number" min="0" step="1" value="${esc(details.rest||'')}" placeholder="e.g. 90"></label><label class="field">Notes<textarea name="notes" rows="3" maxlength="500" placeholder="Equipment, cues, alternatives…">${esc(details.notes||'')}</textarea></label><p class="help">These are plan targets; your logged sets are recorded separately. Identical exercise names on the same day share targets.</p><button class="primary">Save exercise</button></form>`;$('#exerciseedit').onsubmit=e=>{e.preventDefault();let f=new FormData(e.currentTarget),name=String(f.get('name')).trim();if(!name)return;day[section][index]=name;if(name!==old)forgetUnusedDetails(day,old);setDetails(day,name,{sets:String(f.get('sets')).trim(),reps:String(f.get('reps')).trim(),rest:String(f.get('rest')).trim(),notes:String(f.get('notes')).trim()});expandedRoutineDay=dayIndex;save();$('#modal').close();render()};$('#modal').showModal()}

// Broad body regions use primary muscles. Cardio remains independently filterable.
let libraryRegion='all', exerciseImages={}, exerciseImagesReady=false;
const REGION_MUSCLES={core:['abdominals','lower back'],upper:['biceps','chest','forearms','lats','middle back','neck','shoulders','traps','triceps'],lower:['abductors','adductors','calves','glutes','hamstrings','quadriceps']};
const REGIONS=[['all','All regions'],['core','Core'],['upper','Upper body'],['lower','Lower body'],['cardio','Cardio']];
function exerciseRegionMatches(exercise,region){if(region==='all')return true;if(region==='cardio')return exercise.category==='cardio';if(exercise.category==='cardio')return false;let muscles=REGION_MUSCLES[region];return !!muscles&&(exercise.primary||[]).some(m=>muscles.includes(m))}
function regionOptions(selected){return REGIONS.map(([value,label])=>`<option value="${value}" ${selected===value?'selected':''}>${label}</option>`).join('')}
function imageUrl(path){if(typeof path!=='string'||!path||path.startsWith('/')||path.split('/').some(p=>p==='..'||p==='.'||!p))return '';return 'https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/'+path.split('/').map(encodeURIComponent).join('/')}
function exercisePhotos(name){let paths=exerciseImages[name];return Array.isArray(paths)?paths.map(imageUrl).filter(Boolean):[]}
function exerciseVisual(exercise){let photos=exercisePhotos(exercise.name);if(!photos.length)return `<div class="photo-missing">${exerciseImagesReady?'No reference photos available for this exercise.':'Loading reference photos…'}</div>`;let frames=photos.slice(0,2).map((url,i)=>`<img data-exercise-photo class="pose-frame pose-${i}" src="${esc(url)}" alt="${i===0?'Starting':'Second'} pose for ${esc(exercise.name)}" referrerpolicy="no-referrer">`).join('');return `<div class="pose-view"><div class="photo-fallback">Photos unavailable. Connect to the internet to load them.</div>${frames}</div><p class="help">${photos.length>1?'Alternating reference photos, not a full-motion video.':'Reference photo.'} Images load from Free Exercise DB and require internet.</p>`}

libraryView=function(){let all=libraryAll(),equip=[...new Set(all.map(e=>e.equipment).filter(Boolean))].sort();return `<div class="card"><p class="help">${catalog.length?`${catalog.length} exercises from Free Exercise DB, plus cardio and your custom exercises.`:catalogError?'The offline exercise library could not be loaded. Check your connection and reopen the app.':'Loading exercise library…'}</p><label class="field">Search<input id="library-search" type="search" value="${esc(libraryQuery)}" placeholder="Exercise, equipment, category"></label><label class="field">Body region<select id="library-region">${regionOptions(libraryRegion)}</select></label><div class="grid"><label class="field">Muscle / type<select id="library-muscle"><option value="all">All muscles</option><option value="cardio" ${libraryMuscle==='cardio'?'selected':''}>Cardio</option>${MUSCLES.map(m=>`<option value="${m}" ${libraryMuscle===m?'selected':''}>${pretty(m)}</option>`).join('')}</select></label><label class="field">Equipment<select id="library-equipment"><option value="all">All equipment</option>${equip.map(e=>`<option value="${esc(e)}" ${libraryEquipment===e?'selected':''}>${esc(pretty(e))}</option>`).join('')}</select></label></div><p class="help">Body regions use primary muscle labels. Cardio is listed separately; filters work together.</p><button class="secondary" data-custom-add="1">＋ Create custom exercise</button></div><div id="library-results">${libraryItems()}</div><p class="help">Exercise data and photos: <a href="https://github.com/yuhonas/free-exercise-db" target="_blank" rel="noopener" style="color:var(--lime)">Free Exercise DB</a> (Unlicense). Muscle classifications are general guides; photos require internet.</p>`};

const KG_PER_LB=0.45359237, CM_PER_IN=2.54;
function calculateNutrition(p){
 let age=Number(p.age),h=Number(p.height)*(p.heightUnit==='in'?CM_PER_IN:1),w=Number(p.weight)*(p.weightUnit==='lb'?KG_PER_LB:1),activity=Number(p.activity),type=p.sex,mode=p.mode;
 if(!Number.isFinite(age)||age<18||age>100)return {error:'This calculator is for adults ages 18–100. Enter a valid age.'};
 if(!['male','female'].includes(type))return {error:'Select the sex coefficient used by the equation.'};
 if(!Number.isFinite(h)||h<120||h>230||!Number.isFinite(w)||w<35||w>300)return {error:'Check your height and weight and their units.'};
 if(![1.2,1.375,1.55,1.725,1.9].includes(activity))return {error:'Choose an activity level.'};
 if(!['maintain','lose','gain'].includes(mode))return {error:'Choose a goal.'};
 if(p.situation!=='none')return {error:'This general calculator is not suitable during pregnancy or breastfeeding. Ask a clinician or registered dietitian for an individualized target.'};
 let bmr=10*w+6.25*h-5*age+(type==='male'?5:-161),maintenance=bmr*activity,delta=0,changeKg=0,weekly=0,weeks=0,targetKg=w;
 if(mode!=='maintain'){
  let raw=Number(p.targetWeight);weeks=Number(p.weeks);targetKg=raw*(p.weightUnit==='lb'?KG_PER_LB:1);
  if(!p.targetWeight||!Number.isFinite(targetKg)||targetKg<35||targetKg>300||!p.weeks||!Number.isFinite(weeks)||weeks<1||weeks>104)return {error:'Enter a valid target weight and a timeline between 1 and 104 weeks.'};
  changeKg=targetKg-w;if(mode==='lose'&&changeKg>=0)return {error:'For a fat-loss goal, the target weight must be lower than your current weight.'};
  if(mode==='gain'&&changeKg<=0)return {error:'For a muscle-gain goal, the target weight must be higher than your current weight.'};
  if(mode==='lose'&&targetKg/((h/100)**2)<18.5)return {error:'The target weight is below the standard adult healthy BMI range. Discuss an individualized goal with a clinician or registered dietitian.'};
  weekly=Math.abs(changeKg)/weeks;
  if(weekly/w>0.01)return {error:`That timeline requires changing more than 1% of your current weight per week. Choose a longer timeline for a more gradual starting plan.`};
  delta=changeKg*7700/(weeks*7);
 }
 let target=maintenance+delta;
 // Conservative automatic-calculation guardrails, not a personalized safety guarantee.
 let floor=type==='male'?1500:1200;
 if(!Number.isFinite(target)||target<floor)return {error:`That combination produces less than ${floor.toLocaleString()} kcal/day. Choose a less aggressive goal or discuss it with a registered dietitian.`};
 let calories=Math.round(target),protein=Math.round(w*1.6),fat=Math.round(calories*.25/9),carbs=Math.round((calories-protein*4-fat*9)/4);
 if(carbs<130)return {error:'This combination leaves less than 130 g of carbohydrate after the proposed protein and fat targets. Choose a less aggressive goal or discuss an individual plan with a dietitian.'};
 return {calories,protein,fat,carbs,bmr:Math.round(bmr),maintenance:Math.round(maintenance),adjustment:Math.round(delta),weeklyKg:weekly,weightKg:w,targetKg,weeks,mode,weightUnit:p.weightUnit,activity};
}
function nutritionProfileForm(){let p=state.profile||{},hunit=p.heightUnit||'in',wunit=p.weightUnit||'lb';return `<div class="card nutrition-card"><div class="eyebrow">YOUR PERSONAL ESTIMATE</div><h3>Calorie & macro planner</h3><p class="help">Enter your details to estimate maintenance and preview a starting target. Your current dashboard goals change only when you choose to apply them.</p><form id="nutrition-profile"><div class="grid"><label class="field">Age (years)<input name="age" type="number" min="18" max="100" step="1" value="${esc(p.age||'')}" required placeholder="e.g. 28"></label><label class="field">Sex used in equation<select name="sex" required><option value="">Choose</option><option value="male" ${p.sex==='male'?'selected':''}>Male equation</option><option value="female" ${p.sex==='female'?'selected':''}>Female equation</option></select></label></div><p class="help">The published formula uses male/female coefficients. This choice is for the equation, not a gender identity field; if unsure which is appropriate, discuss it with a clinician.</p><div class="grid"><label class="field">Height<input name="height" type="number" min="1" step="any" value="${esc(p.height||'')}" required placeholder="e.g. 70"></label><label class="field">Height unit<select name="heightUnit"><option value="in" ${hunit==='in'?'selected':''}>inches</option><option value="cm" ${hunit==='cm'?'selected':''}>cm</option></select></label><label class="field">Current weight<input name="weight" type="number" min="1" step="any" value="${esc(p.weight||'')}" required placeholder="e.g. 180"></label><label class="field">Weight unit<select name="weightUnit"><option value="lb" ${wunit==='lb'?'selected':''}>lb</option><option value="kg" ${wunit==='kg'?'selected':''}>kg</option></select></label></div><label class="field">Overall activity<select name="activity" required><option value="">Choose your typical activity</option>${[['1.2','Mostly sedentary: little planned exercise'],['1.375','Light: some movement or 1–3 training days'],['1.55','Moderate: active lifestyle or 3–5 training days'],['1.725','High: physically active most days'],['1.9','Very high: demanding training and active work']].map(([v,l])=>`<option value="${v}" ${String(p.activity)===v?'selected':''}>${l}</option>`).join('')}</select></label><p class="help">Choose based on your whole day, including training. The estimate already includes that activity.</p><label class="field">Goal<select name="mode" required><option value="">Choose a goal</option><option value="maintain" ${p.mode==='maintain'?'selected':''}>Maintain</option><option value="lose" ${p.mode==='lose'?'selected':''}>Lose weight / cut</option><option value="gain" ${p.mode==='gain'?'selected':''}>Gain weight / bulk</option></select></label><div class="grid"><label class="field">Goal weight (same unit)<input name="targetWeight" type="number" min="1" step="any" value="${esc(p.targetWeight||'')}" placeholder="For cut or bulk"></label><label class="field">Timeframe (weeks)<input name="weeks" type="number" min="1" max="104" step="1" value="${esc(p.weeks||'')}" placeholder="For cut or bulk"></label></div><label class="field">Pregnancy or breastfeeding<select name="situation" required><option value="">Choose</option><option value="none" ${p.situation==='none'?'selected':''}>Neither</option><option value="pregnant" ${p.situation==='pregnant'?'selected':''}>Pregnant</option><option value="breastfeeding" ${p.situation==='breastfeeding'?'selected':''}>Breastfeeding</option><option value="unsure" ${p.situation==='unsure'?'selected':''}>Prefer individual advice</option></select></label><p class="help">This general adult estimate may not be appropriate for medical conditions, eating-disorder history, or hormone treatment. A registered dietitian can help personalize it.</p><button class="primary">Calculate my estimate</button></form><div id="nutrition-result"></div></div>`}
function nutritionResult(r){let label=r.adjustment<0?'Estimated daily deficit':r.adjustment>0?'Estimated daily surplus':'Daily adjustment',change=r.adjustment===0?'Maintenance':`${Math.abs(r.adjustment)} kcal/day`;let pace=r.mode==='maintain'?'':`<div class="estimate-line"><span>Requested average change</span><strong>${(r.weightUnit==='lb'?r.weeklyKg/KG_PER_LB:r.weeklyKg).toFixed(2)} ${r.weightUnit}/week</strong></div>`;return `<div class="estimate"><div class="eyebrow">YOUR STARTING ESTIMATE</div><div class="estimate-big">${r.calories.toLocaleString()} <small>kcal/day</small></div><div class="estimate-line"><span>Resting energy estimate</span><strong>${r.bmr.toLocaleString()} kcal/day</strong></div><div class="estimate-line"><span>Estimated maintenance</span><strong>${r.maintenance.toLocaleString()} kcal/day</strong></div><div class="estimate-line"><span>${label}</span><strong>${change}</strong></div>${pace}<div class="macrogrid"><div><div class="label">PROTEIN</div><strong>${r.protein}g</strong></div><div><div class="label">CARBS</div><strong>${r.carbs}g</strong></div><div><div class="label">FAT</div><strong>${r.fat}g</strong></div></div><p class="help">Starting estimates, not an exact prediction. Protein is 1.6 g/kg, fat is 25% of calories, and carbs fill the remainder. Monitor your weight trend and how you feel; adjust with a professional as needed.</p><p class="help">The timeline uses a simple 7,700 kcal/kg approximation. Real weight change is nonlinear, so the actual date and intake can differ substantially.${r.mode==='gain'?' Weight gained can include fat and water as well as muscle.':''}</p><button type="button" class="primary" data-apply-estimate="1">Apply these daily targets</button></div>`}
const renderBeforeNutrition=render;
render=function(){renderBeforeNutrition();if(page==='home'){$('.hero').insertAdjacentHTML('afterend',`<div class="affirmation-card"><div class="affirmation-top"><span class="eyebrow">A MOMENT FOR YOU</span><button type="button" class="affirmation-refresh" data-new-affirmation="1" aria-label="Show another affirmation">↻</button></div><p>“${esc(affirmation)}”</p></div>`)}else if(page==='settings'){let content=$('#content');let intro=content.querySelector('.sub');intro.insertAdjacentHTML('afterend',nutritionProfileForm());let form=$('#nutrition-profile');form.addEventListener('input',()=>{previewGoals=null;let result=$('#nutrition-result');if(result)result.innerHTML=''});let oldHeightUnit=form.elements.heightUnit.value,oldWeightUnit=form.elements.weightUnit.value;form.addEventListener('change',ev=>{if(ev.target.name==='heightUnit'&&ev.target.value!==oldHeightUnit){let field=form.elements.height;if(field.value)field.value=(Number(field.value)*(oldHeightUnit==='in'?CM_PER_IN:1/CM_PER_IN)).toFixed(1);oldHeightUnit=ev.target.value}if(ev.target.name==='weightUnit'&&ev.target.value!==oldWeightUnit){for(let name of ['weight','targetWeight']){let field=form.elements[name];if(field.value)field.value=(Number(field.value)*(oldWeightUnit==='lb'?KG_PER_LB:1/KG_PER_LB)).toFixed(1)}oldWeightUnit=ev.target.value}previewGoals=null;let result=$('#nutrition-result');if(result)result.innerHTML=''})}};
document.addEventListener('submit',e=>{if(e.target.id!=='nutrition-profile')return;e.preventDefault();let profile=Object.fromEntries(new FormData(e.target));state.profile=profile;save();let r=calculateNutrition(profile),box=$('#nutrition-result');if(r.error){previewGoals=null;box.innerHTML=`<div class="estimate-warning"><strong>Let’s adjust the plan.</strong><p>${esc(r.error)}</p><p>Review your inputs or talk with a registered dietitian for a tailored plan.</p></div>`;return}previewGoals=r;box.innerHTML=nutritionResult(r);box.scrollIntoView({behavior:'smooth',block:'nearest'})});
document.addEventListener('click',e=>{if(e.target.closest('[data-new-affirmation]')){chooseAffirmation();render();return}if(e.target.closest('[data-apply-estimate]')&&previewGoals){state.goals={calories:previewGoals.calories,protein:previewGoals.protein,carbs:previewGoals.carbs,fat:previewGoals.fat};save();previewGoals=null;render();alert('Daily calorie and macro targets updated.')}});
let wasHidden=false;document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){wasHidden=true;return}if(wasHidden&&document.visibilityState==='visible'){wasHidden=false;chooseAffirmation();if(page==='home')render()}});

render();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>

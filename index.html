p{background:#000b}dialog h2{margin:0;font-size:23px}dialog .row{margin-bottom:12px}.close{background:none;border:0;color:#bbc3b3;font-size:25px}.formscroll{overflow:auto;max-height:72dvh}.note{color:#c7d79e;font-size:12px}.historydate{font-size:12px;color:var(--lime);margin:18px 0 7px;font-weight:700}@media(min-width:600px){main{padding-top:40px}.hero h1{font-size:50px}}
 .metricgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.metric{margin:0}.metric strong{display:block;font-size:30px;margin-top:6px;letter-spacing:-1px}.record{padding:10px 0}.record strong{display:block;font-size:29px;margin-top:6px}.record small{font-size:14px;color:var(--muted)}.trend{height:120px;display:flex;align-items:end;justify-content:space-around;gap:5px;border-bottom:1px solid var(--line);margin-top:15px}.trendcol{height:100%;flex:1;min-width:0;display:flex;align-items:center;justify-content:end;flex-direction:column;gap:5px}.trendcol span,.trendcol small{font-size:10px;color:var(--muted)}.trendbar{width:min(24px,80%);background:var(--lime);border-radius:5px 5px 0 0}.timer{font-size:32px;font-weight:850;letter-spacing:-1px}.smallbtn{border:1px solid #454b3c;background:#262a23;color:white;border-radius:8px;padding:8px;font-size:12px}.setrow{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}.setrow .field{margin:8px 0}.setrow strong{font-size:12px;color:var(--lime)}.plan-day{border-top:1px solid var(--line);padding:14px 0}.plan-day summary{font-size:14px;font-weight:750;display:flex;justify-content:space-between;gap:10px;cursor:pointer;list-style:none}.plan-day summary::before{content:'▸';color:var(--lime)}.plan-day[open] summary::before{content:'▾'}.plan-day summary span:first-of-type{flex:1}.muted{color:var(--muted);font-size:11px;font-weight:500}.plan-day .eyebrow{margin:20px 0 8px}.planlist{margin:0;padding-left:22px;color:var(--muted)}.planlist li{padding-left:2px}.planexercise,.poolitem{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;text-align:left;border:0;border-bottom:1px solid #292d26;background:transparent;color:#eef2e8;padding:10px 0;font-size:13px;line-height:1.35}.planexercise span,.poolitem span{color:var(--lime);white-space:nowrap;font-size:11px}.plan-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:14px}.smallbtn:disabled{opacity:.35;cursor:default}. const key='forge-fitness-v1';const defaults={goals:{calories:2200,protein:150,carbs:250,fat:70},foods:[],sets:[]};let state;try{state=JSON.parse(localStorage.getItem(key))||structuredClone(defaults);if(!state.goals||!Array.isArray(state.foods)||!Array.isArray(state.sets))throw 0}catch{state=structuredClone(defaults)}let page='home';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(key,JSON.stringify(state));const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const num=v=>Number(v)||0;const sum=(items,k)=>items.reduce((a,x)=>a+num(x[k]),0);const datefmt=d=>{let [y,m,day]=d.split('-');return new Date(+y,+m-1,+day).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})};const foodlist=(items)=>items.length?items.map(x=>`<div class="entry row"><div><strong>${esc(x.name)}</strong><small>${esc(x.meal)} · ${num(x.calories)} kcal · ${num(x.protein)}g protein</small></div><button class="iconbtn" data-delete="food" data-id="${esc(x.id)}" aria-label="Delete ${esc(x.name)}">×</button></div>`).join(''):'<p class="empty">Nothing logged yet. Your next small step starts here.</p>';const setlist=(items)=>items.length?items.map(x=>`<div class="entry row"><div><strong>${esc(x.exercise)}</strong><small>${num(x.sets)} sets × ${num(x.reps)} reps · ${num(x.weight)} ${esc(x.unit)}</small></div><button class="iconbtn" data-delete="set" data-id="${esc(x.id)}" aria-label="Delete ${esc(x.exercise)}">×</button></div>`).join(''):'<p class="empty">No exercises logged yet. Time to put in work.</p>';const grouped=(items,renderer)=>{let dates=[...new Set(items.map(x=>x.date))].sort().reverse();return dates.length?dates.map(d=>`<div class="historydate">${datefmt(d)}</div><div class="card">${renderer(items.filter(x=>x.date===d).reverse())}</div>`).join(''):`<div class="card">${renderer([])}</div>`};
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let foods=state.foods.filter(x=>x.date===today()),sets=state.sets.filter(x=>x.date===today()),cal=sum(foods,'calories'),g=state.goals;let macro=(name,k)=>`<div><div class="label">${name}</div><div class="bar"><span style="width:${Math.min(100,num(g[k])?sum(foods,k)/num(g[k])*100:0)}%"></span></div><strong>${sum(foods,k)} <span class="label">/ ${num(g[k])}g</span></strong></div>`;if(page==='home')$('#content').innerHTML=`<section class="hero"><div class="eyebrow">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div><h1>SHOW UP.<br>LEVEL UP<span style="color:var(--lime)">.</span></h1><p>Build the body. Track the process.</p></section><div class="card"><div class="cardtop"><div><div class="label">TODAY'S FUEL</div><div class="big">${cal.toLocaleString()} <small>kcal</small></div><div class="label">${Math.max(0,num(g.calories)-cal).toLocaleString()} kcal remaining · Goal ${num(g.calories).toLocaleString()}</div></div><div class="ring" style="--progress:${Math.min(100,num(g.calories)?cal/num(g.calories)*100:0)}%" data-text="${Math.round(num(g.calories)?cal/num(g.calories)*100:0)}%"></div></div><div class="macrogrid">${macro('PROTEIN','protein')}${macro('CARBS','carbs')}${macro('FAT','fat')}</div></div><div class="sectionhead"><h2>Make it count</h2><small>QUICK ACTIONS</small></div><div class="quick"><button class="action" data-add="food"><span>＋</span>Log food</button><button class="action alt" data-add="set"><span>↗</span>Log exercise</button></div><div class="sectionhead"><h2>Today's training</h2><small>${sets.length} EXERCISES</small></div><div class="card">${setlist([...sets].reverse())}</div><div class="sectionhead"><h2>Today's fuel</h2><small>${foods.length} ENTRIES</small></div><div class="card">${foodlist([...foods].reverse())}</div>`;if(page==='food')$('#content').innerHTML=`<h2 class="page">Fuel your work<span style="color:var(--lime)">.</span></h2><p class="sub">Every meal is part of the plan.</p><button class="primary" data-add="food">＋ Log food</button><div class="sectionhead"><h2>Food history</h2><small>ALL ENTRIES</small></div>${grouped(state.foods,foodlist)}`;if(page==='training')$('#content').innerHTML=`<h2 class="page">Put in work<span style="color:var(--lime)">.</span></h2><p class="sub">Record the reps. See the progress.</p><button class="primary" data-add="set">＋ Log exercise</button><div class="sectionhead"><h2>Training history</h2><small>ALL ENTRIES</small></div>${grouped(state.sets,setlist)}`;if(page==='settings')$('#content').innerHTML=`<h2 class="page">Your setup<span style="color:var(--lime)">.</span></h2><p class="sub">Make the numbers work for you.</p><div class="card"><h3>Daily targets</h3><p class="help">Starting placeholders—set these to your own goals.</p><form id="goals">${['calories','protein','carbs','fat'].map(k=>`<label class="field">${k[0].toUpperCase()+k.slice(1)} ${k==='calories'?'(kcal)':'(g)'}<input required type="number" min="0" step="1" name="${k}" value="${num(g[k])}"></label>`).join('')}<button class="primary">Save targets</button></form></div><div class="card"><h3>Your data</h3><p class="help">Entries are stored on this device. Export a backup regularly; clearing browser or web app data can erase them. Import replaces current entries.</p><button class="secondary" id="export">Export backup</button><label class="secondary" style="display:block;text-align:center;cursor:pointer">Import backup<input id="import" type="file" accept="application/json" hidden></label></div>`}
function openModal(type){$('#modalTitle').textContent=type==='food'?'Log food':'Log exercise';let date=`<label class="field">Date<input type="date" name="date" required value="${today()}"></label>`;let food=`<label class="field">Food or meal<input name="name" required maxlength="100" placeholder="e.g. Chicken and rice"></label><label class="field">Meal<select name="meal"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option></select></label><div class="grid">${[['calories','Calories (kcal)'],['protein','Protein (g)'],['carbs','Carbs (g)'],['fat','Fat (g)']].map(([k,l])=>`<label class="field">${l}<input type="number" min="0" step="any" name="${k}" value="0" required></label>`).join('')}</div>`;let exercise=`<label class="field">Exercise<input name="exercise" required maxlength="100" placeholder="e.g. Bench press"></label><div class="grid"><label class="field">Sets<input type="number" min="1" step="1" name="sets" value="3" required></label><label class="field">Reps per set<input type="number" min="1" step="1" name="reps" value="10" required></label><label class="field">Weight<input type="number" min="0" step="any" name="weight" value="0" required></label><label class="field">Unit<select name="unit"><option>lb</option><option>kg</option></select></label></div><p class="help">For sets with different weights or reps, log a separate entry for each.</p>`;$('#modalBody').innerHTML=`<form id="entryform">${date}${type==='food'?food:exercise}<button class="primary">Save ${type==='food'?'food':'exercise'}</button></form>`;$('#entryform').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));data.id=crypto.randomUUID();(type==='food'?state.foods:state.sets).push(data);save();$('#modal').close();render()};$('#modal').showModal()}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-page]'),add=e.target.closest('[data-add]'),del=e.target.closest('[data-delete]');if(nav){page=nav.dataset.page;render();window.scrollTo(0,0)}if(add)openModal(add.dataset.add);if(del&&confirm('Delete this entry?')){let arr=del.dataset.delete==='food'?'foods':'sets';state[arr]=state[arr].filter(x=>x.id!==del.dataset.id);save();render()}if(e.target.id==='close')$('#modal').close();if(e.target.id==='export'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download=`forge-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}});document.addEventListener('submit',e=>{if(e.target.id==='goals'){e.preventDefault();let f=new FormData(e.target);for(let k of ['calories','protein','carbs','fat'])state.goals[k]=num(f.get(k));save();alert('Targets saved.');render()}});document.addEventListener('change',async e=>{if(e.target.id==='import'&&e.target.files[0]){try{let data=JSON.parse(await e.target.files[0].text());if(!data.goals||!Array.isArray(data.foods)||!Array.isArray(data.sets))throw Error();if(confirm('Replace your current entries and targets with this backup?')){state=data;save();render()}}catch{alert('Could not read that backup.')}}});
// Workout-first views and per-set logging, retaining compatibility with the first prototype.
const DEFAULT_DAYS=[{"name":"Day 1 — Back + Biceps + Traps","priority":["Wide-Grip Lat Pulldown","Chest-Supported Row","Kelso Shrug","Standing Dumbbell Curl","Hammer Curl","Barbell Shrug"],"optional":["Meadows Row","Farmer’s Walk","Flat Bench / Machine Press","Pec Deck / Cable Fly"]},{"name":"Day 2 — Shoulders + Arms + Forearms","priority":["Dumbbell Overhead Press","Cable Lateral Raise","Face-Away Bayesian Curl","Overhead Cable Triceps Extension","Reverse Curl","Reverse Pec Deck"],"optional":["EZ-Bar Curl","Triceps Pressdown","Wrist Curl","Farmer’s Walk","Neck Curl"]},{"name":"Day 3 — Quads + Calves + Legs","priority":["Hack Squat / Squat","Leg Press","Leg Extension","Calf Raise","Romanian Deadlift","Leg Curl"],"optional":["Hip Thrust","Cable Crunch","Hanging Leg Raise","Ab Wheel / Pallof Press"]},{"name":"Day 4 — Upper Back + Shoulders + Arms","priority":["Neutral-Grip Pull-Up","Cable Row","Kelso Shrug","Cable Lateral Raise","Preacher Curl only if pain-free; otherwise Standing Cable Curl","Triceps Pressdown","Reverse Curl"],"optional":["Machine Shoulder Press","Barbell Shrug","Farmer’s Walk","Machine/DB Chest Press","Rope Face Pull","Cable Crunch","Neck Extension"]},{"name":"Day 5 — Back + Arms + Delts","priority":["Neutral-Grip Lat Pulldown","One-Arm Dumbbell Row","Incline Dumbbell Curl","Overhead Cable Triceps Extension","Hammer Curl","Cable Lateral Raise","Dumbbell Shrug"],"optional":["Cable Lat Prayer","Triceps Pressdown","Inverse Zottman Curl","Farmer’s Walk or Dead Hang","Flat Bench / Machine Press","Cable Crossover","Hanging Leg Raise"]}];
const DEFAULT_POOL=["Face-Away Bayesian Curl","Machine Preacher Curl (only if comfortable)","Preacher Hammer Curl (only if comfortable)","EZ-Bar Curl","Standing Dumbbell Curl","Incline Dumbbell Curl","Lying Dumbbell Curl","Modified 21s","Standing Cable Curl","Bayesian Cable Curl Variation","Cheat Curl","Strict Curl","Hammer Curl","Inverse Zottman Curl"];
let selectedExercise=''; let restEnd=0; let restHandle=null;
function ensureExtraState(){if(!state.plans||typeof state.plans!=='object')state.plans={Push:'',Pull:'',Legs:''};if(!Array.isArray(state.body))state.body=[];if(!Array.isArray(state.dayPlans))state.dayPlans=structuredClone(DEFAULT_DAYS);if(!Array.isArray(state.exercisePool))state.exercisePool=[...DEFAULT_POOL]}
function bodyMarkup(){ensureExtraState();let entries=[...state.body].sort((a,b)=>b.date.localeCompare(a.date));return entries.length?entries.slice(0,5).map(x=>`<div class="entry row"><div><strong>${num(x.weight)} ${esc(x.unit)}</strong><small>${datefmt(x.date)}</small></div><button class="iconbtn" data-body-delete="${esc(x.id)}" aria-label="Delete body weight">×</button></div>`).join(''):'<p class="empty">No weigh-ins yet. Add one to see your history.</p>'}
function plansMarkup(){ensureExtraState();const exerciseList=(list,start=1)=>list.length?`<ol class="planlist" start="${start}">${list.map(name=>`<li><button class="planexercise" data-plan-log="${esc(name)}">${esc(name)} <span>＋ log</span></button></li>`).join('')}</ol>`:'<p class="help">No exercises added.</p>';return state.dayPlans.map((d,i)=>`<details class="plan-day"><summary><span>${esc(d.name)}</span><span class="muted">${d.priority.length+d.optional.length} exercises</span></summary><p class="eyebrow">PRIORITY WORK</p>${exerciseList(d.priority)}<p class="eyebrow">IF YOU HAVE MORE TIME</p>${exerciseList(d.optional,d.priority.length+1)}<div class="plan-actions"><button class="smallbtn" data-plan-edit="${i}">Edit day</button><button class="smallbtn" data-plan-move="${i}" data-dir="-1" ${i===0?'disabled':''}>↑</button><button class="smallbtn" data-plan-move="${i}" data-dir="1" ${i===state.dayPlans.length-1?'disabled':''}>↓</button><button class="smallbtn" data-plan-delete="${i}">Remove day</button></div></details>`).join('')||'<p class="empty">Add a training day to build your routine.</p>'}
function poolMarkup(){ensureExtraState();return `<details class="plan-day"><summary><span>Biceps exercise pool</span><span class="muted">${state.exercisePool.length} exercises</span></summary><p class="help">Tap an exercise to log it.</p>${state.exercisePool.map(n=>`<button class="poolitem" data-plan-log="${esc(n)}">${esc(n)} <span>＋</span></button>`).join('')}<button class="secondary" data-plan-pool="edit">Edit exercise pool</button></details>`}

const normalizedName=s=>String(s||'').trim().toLowerCase();
const toLb=(w,u)=>num(w)*(u==='kg'?2.20462262185:1);
const displayWeight=(lb,u)=>Math.round((u==='kg'?lb/2.20462262185:lb)*10)/10;
const unitFor=x=>x.unit==='kg'?'kg':'lb';
const exerciseNames=()=>[...new Map(state.sets.map(x=>[normalizedName(x.exercise),String(x.exercise).trim()])).values()].filter(Boolean).sort((a,b)=>a.localeCompare(b));
const workoutSummary=()=>{
 const all=state.sets, days=new Set(all.map(x=>x.date)).size, count=all.reduce((a,x)=>a+Math.max(1,num(x.sets)),0);
 return {days,count};
};
const trainingMarkup=()=>{
 let names=exerciseNames(), name=names.find(n=>normalizedName(n)===normalizedName(selectedExercise))||names[0]||'', matching=state.sets.filter(x=>normalizedName(x.exercise)===normalizedName(name));
 let unit=matching.length?unitFor(matching[matching.length-1]):'lb';
 let byDay={}; for(let x of matching){let w=toLb(x.weight,unitFor(x));if(w>0)byDay[x.date]=Math.max(byDay[x.date]||0,w)}
 let dates=Object.keys(byDay).sort().slice(-8), max=Math.max(0,...dates.map(d=>byDay[d])), best=matching.filter(x=>toLb(x.weight,unitFor(x))>0).sort((a,b)=>toLb(b.weight,unitFor(b))-toLb(a.weight,unitFor(a)))[0];

openModal=function(type){oldModal(type);if(type!=='set')return;let form=$('#workoutform'),help=form.querySelector('p.help'),label=document.createElement('label');label.className='field';label.innerHTML=`Primary muscle <select name="muscle"><option value="">Unassigned</option>${MUSCLES.map(m=>`<option value="${m}">${pretty(m)}</option>`).join('')}</select>`;help.before(label);let exercise=form.querySelector('[name=exercise]'),sel=form.querySelector('[name=muscle]');exercise.addEventListener('change',()=>{sel.value=primaryFor(exercise.value)});let submit=form.onsubmit;form.onsubmit=e=>{let target=sel.value,before=state.sets.length;submit(e);if(state.sets.length>before){state.sets.slice(before).forEach(s=>s.muscle=target);save()}}};
function prefillWorkout(name){openModal('set');let form=$('#workoutform');form.elements.exercise.value=name;form.elements.muscle.value=primaryFor(name)}
function openCardio(name=''){ensureExtraState();$('#modalTitle').textContent='Log cardio';$('#modalBody').innerHTML=`<form id="cardioform"><label class="field">Date<input type="date" name="date" value="${today()}" required></label><label class="field">Activity<input name="name" required maxlength="100" value="${esc(name)}" placeholder="e.g. Walking, Cycling"></label><label class="field">Duration (minutes)<input name="minutes" type="number" min="0.1" step="any" required></label><div class="grid"><label class="field">Distance (optional)<input name="distance" type="number" min="0" step="any"></label><label class="field">Distance unit<select name="unit"><option>mi</option><option>km</option><option>m</option></select></label></div><button class="primary">Save cardio</button></form>`;$('#cardioform').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.currentTarget));x.name=x.name.trim();if(!x.name)return;x.id=crypto.randomUUID();state.cardio.push(x);save();$('#modal').close();trainingTab='history';render()};$('#modal').showModal()}
function addToDay(name){ensureExtraState();$('#modalTitle').textContent='Add to routine';if(!state.dayPlans.length){$('#modalBody').innerHTML='<p class="help">Create a training day in Routine first.</p>';$('#modal').showModal();return}$('#modalBody').innerHTML=`<form id="addtoday"><p>${esc(name)}</p><label class="field">Training day<select name="day">${state.dayPlans.map((d,i)=>`<option value="${i}">${esc(d.name)}</option>`).join('')}</select></label><label class="field">Section<select name="section"><option value="priority">Priority</option><option value="optional">Optional</option></select></label><button class="primary">Add exercise</button></form>`;$('#addtoday').onsubmit=e=>{e.preventDefault();let f=new FormData(e.currentTarget),day=state.dayPlans[Number(f.get('day'))];day[f.get('section')].push(name);save();$('#modal').close();render()};$('#modal').showModal()}
function newRoutine(){ensureExtraState();$('#modalTitle').textContent='New routine';$('#modalBody').innerHTML=`<form id="routineform"><label class="field">Routine name<input name="name" required maxlength="100" placeholder="e.g. Three-day split"></label><label class="field">Start with<select name="days"><option value="3">3 empty days</option><option value="5">5 empty days</option><option value="0">Empty routine</option><option value="copy">Copy current routine</option></select></label><button class="primary">Create routine</button></form>`;$('#routineform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.currentTarget),name=String(f.get('name')).trim(),n=f.get('days');if(!name)return;let days=n==='copy'?structuredClone(state.dayPlans):Array.from({length:Number(n)},(_,i)=>({name:`Day ${i+1}`,priority:[],optional:[]}));let id=crypto.randomUUID();state.routines.push({id,name,days});state.activeRoutine=id;state.dayPlans=days;save();$('#modal').close();render()};$('#modal').showModal()}
function customExercise(){ensureExtraState();$('#modalTitle').textContent='Custom exercise';$('#modalBody').innerHTML=`<form id="customform"><label class="field">Name<input name="name" required maxlength="100"></label><label class="field">Primary muscle<select name="muscle"><option value="">Unassigned</option>${MUSCLES.map(m=>`<option value="${m}">${pretty(m)}</option>`).join('')}</select></label><label class="field">Type<select name="category"><option value="strength">Strength</option><option value="cardio">Cardio</option><option value="stretching">Stretching</option></select></label><label class="field">Equipment<input name="equipment" maxlength="60" placeholder="e.g. cable"></label><button class="primary">Save exercise</button></form>`;$('#customform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.currentTarget),name=String(f.get('name')).trim();if(!name)return;if(libraryAll().some(x=>normalizedName(x.name)===normalizedName(name))){alert('An exercise with that name already exists.');return}state.customExercises.push({name,primary:f.get('muscle')?[f.get('muscle')]:[],secondary:[],category:String(f.get('category')),equipment:String(f.get('equipment')).trim()||'varies',instructions:[],custom:true});save();$('#modal').close();libraryQuery=name;libraryMuscle='all';libraryEquipment='all';libraryPage=0;render()};$('#modal').showModal()}
function assignMuscle(name){$('#modalTitle').textContent='Assign primary muscle';$('#modalBody').innerHTML=`<form id="assignform"><p>${esc(name)}</p><p class="help">This updates the primary muscle for all existing sets logged under this exact exercise name.</p><label class="field">Primary muscle<select name="muscle"><option value="">Unassigned</option>${MUSCLES.map(m=>`<option value="${m}" ${m===primaryFor(name)?'selected':''}>${pretty(m)}</option>`).join('')}</select></label><button class="primary">Update target</button></form>`;$('#assignform').onsubmit=e=>{e.preventDefault();let value=String(new FormData(e.currentTarget).get('muscle'));state.sets.filter(x=>x.exercise===name).forEach(x=>x.muscle=value);save();$('#modal').close();render()};$('#modal').showModal()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-assign-muscle]');if(b)assignMuscle(b.dataset.assignMuscle)});
function infoExercise(name){let e=findExercise(name);if(!e)return;$('#modalTitle').textContent=e.name;$('#modalBody').innerHTML=`<p class="help">${esc(pretty(e.category))} · ${esc(pretty(e.equipment))}</p><p>Primary: ${esc((e.primary||[]).map(pretty).join(', ')||'not specified')}</p><p class="help">Secondary: ${esc((e.secondary||[]).map(pretty).join(', ')||'not specified')}</p>${e.instructions?.length?`<ol class="instructions">${e.instructions.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:'<p class="help">No instructions supplied for this activity.</p>'}<button class="primary" data-modal-add="${esc(e.name)}">＋ Add to routine</button>`;$('#modal').showModal()}
document.addEventListener('click',e=>{let a=e.target.closest('[data-training-tab]');if(a){trainingTab=a.dataset.trainingTab;render();return}let plan=e.target.closest('[data-plan-log]');if(plan){let form=$('#workoutform');if(form?.elements.muscle)form.elements.muscle.value=primaryFor(plan.dataset.planLog);return}let action=e.target.closest('[data-lib-log],[data-lib-info],[data-lib-add],[data-modal-add],[data-cardio-add],[data-cardio-delete],[data-lib-prev],[data-lib-next],[data-custom-add],[data-custom-remove],[data-routine-new],[data-routine-rename],[data-routine-delete]');if(!action)return;let d=action.dataset;if('libLog'in d){let ex=findExercise(d.libLog);ex?.category==='cardio'?openCardio(ex.name):prefillWorkout(d.libLog)}else if('libInfo'in d)infoExercise(d.libInfo);else if('libAdd'in d||'modalAdd'in d){if($('#modal').open)$('#modal').close();addToDay(d.libAdd||d.modalAdd)}else if('cardioAdd'in d)openCardio();else if('cardioDelete'in d){if(confirm('Delete this cardio entry?')){state.cardio=state.cardio.filter(x=>x.id!==d.cardioDelete);save();render()}}else if('libPrev'in d){libraryPage=Math.max(0,libraryPage-1);$('#library-results').innerHTML=libraryItems()}else if('libNext'in d){libraryPage++;$('#library-results').innerHTML=libraryItems()}else if('customAdd'in d)customExercise();else if('customRemove'in d){if(confirm('Remove this custom exercise? Your logs and routines will remain.')){state.customExercises=state.customExercises.filter(x=>x.name!==d.customRemove);save();render()}}else if('routineNew'in d)newRoutine();else if('routineRename'in d){let r=state.routines.find(x=>x.id===state.activeRoutine),name=prompt('Routine name',r.name);if(name?.trim()){r.name=name.trim().slice(0,100);save();render()}}else if('routineDelete'in d){let r=state.routines.find(x=>x.id===state.activeRoutine);if(state.routines.length>1&&confirm(`Delete “${r.name}”? Workout history will remain.`)){state.routines=state.routines.filter(x=>x.id!==r.id);state.activeRoutine=state.routines[0].id;state.dayPlans=state.routines[0].days;save();render()}}});
document.addEventListener('input',e=>{if(e.target.id==='library-search'){libraryQuery=e.target.value;libraryPage=0;$('#library-results').innerHTML=libraryItems()}});
document.addEventListener('change',e=>{if(e.target.id==='library-muscle'){libraryMuscle=e.target.value;libraryPage=0;$('#library-results').innerHTML=libraryItems()}else if(e.target.id==='library-equipment'){libraryEquipment=e.target.value;libraryPage=0;$('#library-results').innerHTML=libraryItems()}else if(e.target.id==='analysis-muscle'){analysisMuscle=e.target.value;selectedExercise='';render()}else if(e.target.id==='routine-select'){ensureExtraState();state.activeRoutine=e.target.value;state.dayPlans=state.routines.find(x=>x.id===state.activeRoutine).days;save();render()}});
fetch('./exercises.json').then(r=>{if(!r.ok)throw Error('library unavailable');return r.json()}).then(data=>{if(!Array.isArray(data))throw Error('invalid library');catalog=data;if(page==='training'&&['library','analysis'].includes(trainingTab))render()}).catch(()=>{catalogError=true;if(page==='training'&&trainingTab==='library')render()});

render();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
